        function pickNewTarget() {
            if (isEating || isShootingWeb) return;
            if (activeTool === 'finger' && trackingCursor) return;
            if (isFrontLegDancing) return;
            if (isChasingBall) return;
            if (foodGroup.children.length > 0 && spiderHungryLevel < 10) return;

            const limit = (boxSize / 2) - 2;
            spiderSpeed = 0.02 + Math.random() * 0.06;

            if (Math.random() < 0.3) {
                targetingBall = true;
                spiderSpeed = 0.06 + Math.random() * 0.04;
            } else {
                targetingBall = false;
                targetPosition.set(
                    (Math.random() - 0.5) * limit * 2,
                    0,
                    (Math.random() - 0.5) * limit * 2
                );
            }
            isJumping = Math.random() < 0.4;
            startJumpPos.copy(spiderGroup.position);
            jumpProgress = 0;
        }

        pickNewTarget();
        updateSpiderHungerDisplay();

        const clock = new THREE.Clock();
        let walkCycle = 0;
        let idleTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (webShootCooldown > 0) {
                webShootCooldown -= delta;
            }

            if (happyTimer > 0) {
                happyTimer -= delta;
                if (happyTimer <= 0) {
                    isChasingBall = false;
                }
                updateEmotionStatusDisplay();
            }

            if (isHoldingBall && activeTool === 'finger') {
                chargeTime += delta;

                const maxHoldTime = 3.0;
                const effectiveTime = Math.min(chargeTime, maxHoldTime);
                const shakeIntensity = effectiveTime * 0.15;

                ball.position.set(
                    ballOriginalPos.x + (Math.random() - 0.5) * shakeIntensity,
                    ballOriginalPos.y + (Math.random() - 0.5) * shakeIntensity,
                    ballOriginalPos.z + (Math.random() - 0.5) * shakeIntensity
                );
            }

            const waterPosAttr = waterGeo.attributes.position;
            for (let i = 0; i < waterPosAttr.count; i++) {
                const vx = waterPosAttr.getX(i);
                const vy = waterPosAttr.getY(i);
                const waveZ = Math.sin(vx * 1.5 + elapsedTime * 2.5) * Math.cos(vy * 1.5 + elapsedTime * 2.0) * 0.06 +
                    Math.sin(vx * 3.0 - elapsedTime * 3.5) * 0.02;
                waterPosAttr.setZ(i, waveZ);
            }
            waterPosAttr.needsUpdate = true;
            waterGeo.computeVertexNormals();

            for (let i = activeRipples.length - 1; i >= 0; i--) {
                const r = activeRipples[i];
                r.life -= delta * 1.5;
                r.mesh.scale.addScalar(delta * 3.0);
                r.mesh.material.opacity = r.life * 0.8;

                if (r.life <= 0) {
                    scene.remove(r.mesh);
                    r.mesh.geometry.dispose();
                    r.mesh.material.dispose();
                    activeRipples.splice(i, 1);
                }
            }

            for (let i = activePopups.length - 1; i >= 0; i--) {
                const p = activePopups[i];
                p.life -= delta * 1.2;
                p.sprite.position.addScaledVector(p.velocity, delta);
                p.sprite.material.opacity = Math.max(0, p.life);

                if (p.life <= 0) {
                    scene.remove(p.sprite);
                    p.sprite.material.map.dispose();
                    p.sprite.material.dispose();
                    activePopups.splice(i, 1);
                }
            }

            for (let i = emotionParticles.length - 1; i >= 0; i--) {
                const ep = emotionParticles[i];
                ep.life -= delta * 1.2;
                ep.sprite.position.addScaledVector(ep.velocity, delta);
                ep.sprite.material.opacity = Math.max(0, ep.life);

                if (ep.life <= 0) {
                    scene.remove(ep.sprite);
                    ep.sprite.material.map.dispose();
                    ep.sprite.material.dispose();
                    emotionParticles.splice(i, 1);
                }
            }

            const subSteps = 12;
            const subDelta = delta / subSteps;

            for (let step = 0; step < subSteps; step++) {
                if (!isHoldingBall && grabbedObject !== 'ball') {
                    ballVelocity.y -= gravity * subDelta;
                    ballVelocity.x *= Math.pow(airDrag, subDelta / 0.016);
                    ballVelocity.z *= Math.pow(airDrag, subDelta / 0.016);
                    ball.position.addScaledVector(ballVelocity, subDelta);

                    const groundH = getTerrainHeight(ball.position.x, ball.position.z);
                    const ceilingLimit = boxSize - ballRadius;
                    const boxLimit = (boxSize / 2) - ballRadius;

                    const isBallInWater = groundH < waterLevel && ball.position.y <= waterLevel + ballRadius;
                    if (isBallInWater && !ballWasInWater && Math.abs(ballVelocity.y) > 2 && step === 0) {
                        triggerSplash(ball.position);
                    }
                    ballWasInWater = isBallInWater;

                    if (ball.position.y - ballRadius < groundH + 1.5) {
                        const terrainPoint = new THREE.Vector3(ball.position.x, groundH, ball.position.z);
                        const terrainNormal = getTerrainNormal(ball.position.x, ball.position.z);
                        const toBall = new THREE.Vector3().subVectors(ball.position, terrainPoint);
                        const distAlongNormal = toBall.dot(terrainNormal);

                        if (distAlongNormal < ballRadius) {
                            const penetration = ballRadius - distAlongNormal;
                            ball.position.addScaledVector(terrainNormal, penetration);

                            const dot = ballVelocity.dot(terrainNormal);
                            if (dot < 0) {
                                const impactSpeed = Math.abs(dot);
                                if (impactSpeed > 1.5 && step === 0) {
                                    playBounceSound(Math.min(impactSpeed / 10, 1.0));
                                }
                                ballVelocity.addScaledVector(terrainNormal, -dot * (1.0 + bounceFactor));
                            }

                            const frictionFactor = Math.pow(surfaceFriction, subDelta / 0.016);
                            ballVelocity.x *= frictionFactor;
                            ballVelocity.z *= frictionFactor;

                            if (ballVelocity.length() < 0.08 && Math.abs(ballVelocity.y) < 0.1) {
                                ballVelocity.set(0, 0, 0);
                            }
                        }
                    }

                    if (ball.position.y >= ceilingLimit) {
                        ball.position.y = ceilingLimit;
                        if (step === 0 && ballVelocity.y > 1.0) playBounceSound(0.5);
                        ballVelocity.y *= -bounceFactor;
                    }

                    if (ball.position.x > boxLimit) {
                        ball.position.x = boxLimit;
                        if (step === 0 && Math.abs(ballVelocity.x) > 1.0) playBounceSound(0.4);
                        ballVelocity.x *= -bounceFactor;
                    } else if (ball.position.x < -boxLimit) {
                        ball.position.x = -boxLimit;
                        if (step === 0 && Math.abs(ballVelocity.x) > 1.0) playBounceSound(0.4);
                        ballVelocity.x *= -bounceFactor;
                    }
                    if (ball.position.z > boxLimit) {
                        ball.position.z = boxLimit;
                        if (step === 0 && Math.abs(ballVelocity.z) > 1.0) playBounceSound(0.4);
                        ballVelocity.z *= -bounceFactor;
                    } else if (ball.position.z < -boxLimit) {
                        ball.position.z = -boxLimit;
                        if (step === 0 && Math.abs(ballVelocity.z) > 1.0) playBounceSound(0.4);
                        ballVelocity.z *= -bounceFactor;
                    }
                }

                let dragMultiplier = isDragActive ? 0.92 : 1.0;

                foodGroup.children.forEach(food => {
                    if (grabbedObject === 'food' && grabbedFoodPiece === food) return;
                    if (isShootingWeb && webTargetFood === food && webState === 'pulling') return;
                    if (!food.userData.velocity) return;

                    const foodRadius = food.userData.radius || 0.3;

                    if (food.userData.isInsect) {
                        food.userData.flightTimer += subDelta;
                        const wingSpeed = 40.0;
                        if (food.userData.leftWing && food.userData.rightWing) {
                            food.userData.leftWing.rotation.z = Math.sin(food.userData.flightTimer * wingSpeed) * 0.8;
                            food.userData.rightWing.rotation.z = -Math.sin(food.userData.flightTimer * wingSpeed) * 0.8;
                        }

                        if (Math.random() < 0.05) {
                            food.userData.velocity.x += (Math.random() - 0.5) * 3;
                            food.userData.velocity.z += (Math.random() - 0.5) * 3;
                            food.userData.velocity.y += (Math.random() - 0.5) * 2;
                        }

                        food.userData.velocity.y += (Math.sin(food.userData.flightTimer * 3) * 15) * subDelta;
                    }

                    food.userData.velocity.y -= gravity * subDelta;
                    food.userData.velocity.x *= Math.pow(airDrag * dragMultiplier, subDelta / 0.016);
                    food.userData.velocity.z *= Math.pow(airDrag * dragMultiplier, subDelta / 0.016);

                    food.position.addScaledVector(food.userData.velocity, subDelta);

                    if (!food.userData.isInsect && food.userData.velocity.length() > 0.1) {
                        food.rotation.x += subDelta * 2;
                        food.rotation.y += subDelta * 2;
                    } else if (food.userData.isInsect && food.userData.velocity.lengthSq() > 0.01) {
                        const lookDir = food.userData.velocity.clone().normalize();
                        food.lookAt(food.position.clone().add(lookDir));
                    }

                    const groundH = getTerrainHeight(food.position.x, food.position.z);
                    const boxLimit = (boxSize / 2) - 0.5;

                    const isFoodInWater = groundH < waterLevel && food.position.y <= waterLevel + foodRadius;
                    if (isFoodInWater && !food.userData.wasInWater && Math.abs(food.userData.velocity.y) > 1 && step === 0) {
                        triggerSplash(food.position);
                    }
                    food.userData.wasInWater = isFoodInWater;

                    const minAllowedY = groundH + foodRadius;
                    if (food.position.y < minAllowedY) {
                        food.position.y = minAllowedY;
                        if (food.userData.isInsect) {
                            if (Math.random() < 0.03) {
                                food.userData.velocity.y = 8 + Math.random() * 5;
                                food.userData.velocity.x += (Math.random() - 0.5) * 6;
                                food.userData.velocity.z += (Math.random() - 0.5) * 6;
                            } else {
                                food.userData.velocity.y = 0;
                                food.userData.velocity.x *= 0.8;
                                food.userData.velocity.z *= 0.8;
                            }
                        } else {
                            food.userData.velocity.y = -food.userData.velocity.y * 0.15;
                            food.userData.velocity.x *= 0.75;
                            food.userData.velocity.z *= 0.75;
                            if (Math.abs(food.userData.velocity.y) < 0.2) {
                                food.userData.velocity.y = 0;
                            }
                        }
                    }

                    if (food.position.x > boxLimit) {
                        food.position.x = boxLimit;
                        food.userData.velocity.x *= -bounceFactor;
                    } else if (food.position.x < -boxLimit) {
                        food.position.x = -boxLimit;
                        food.userData.velocity.x *= -bounceFactor;
                    }
                    if (food.position.z > boxLimit) {
                        food.position.z = boxLimit;
                        food.userData.velocity.z *= -bounceFactor;
                    } else if (food.position.z < -boxLimit) {
                        food.position.z = -boxLimit;
                        food.userData.velocity.z *= -bounceFactor;
                    }
                });
            }

            const horizontalSpeed = Math.sqrt(ballVelocity.x * ballVelocity.x + ballVelocity.z * ballVelocity.z);
            if (horizontalSpeed > 0.05) {
                const rotAxis = new THREE.Vector3(-ballVelocity.z, 0, ballVelocity.x).normalize();
                const angularDist = (horizontalSpeed * delta) / ballRadius;
                ball.rotateOnWorldAxis(rotAxis, angularDist);
            }

            if (!isEating && !isShootingWeb && spiderHungryLevel < 10 && foodGroup.children.length > 0) {
                let closestFood = null;
                let minDist = Infinity;

                foodGroup.children.forEach(food => {
                    const dist = spiderGroup.position.distanceTo(food.position);
                    if (dist < minDist) {
                        minDist = dist;
                        closestFood = food;
                    }
                });

                if (closestFood) {
                    const useWebShooting = Math.random() < 0.2 && webShootCooldown <= 0;

                    if (useWebShooting && minDist <= 16.0) {
                        webTargetFood = closestFood;
                        isShootingWeb = true;
                        webState = 'shooting';
                        webShootCooldown = 6.0;
                        isJumping = false;
                        isFrontLegDancing = false;
                        isRandomWebShot = false;

                        const spiderMouthPos = spiderGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));
                        webProjectilePos.copy(spiderMouthPos);
                        const toTarget = new THREE.Vector3().subVectors(webTargetFood.position, spiderMouthPos);
                        const distance = toTarget.length();
                        toTarget.normalize();
                        webProjectileVel.copy(toTarget).multiplyScalar(Math.min(10 + distance * 0.2, 16));
                        webProjectileVel.y = 2 + distance * 0.1;

                        if (!webProjectileMesh) {
                            webProjectileMesh = new THREE.Mesh(webProjGeo, webProjMat);
                            scene.add(webProjectileMesh);
                        }
                        webProjectileMesh.position.copy(webProjectilePos);
                        webProjectileMesh.visible = true;
                    } else {
                        targetFoodPiece = closestFood;
                        targetPosition.set(targetFoodPiece.position.x, 0, targetFoodPiece.position.z);
                        spiderSpeed = 0.07;

                        if (minDist <= 1.8) {
                            isEating = true;
                            eatingTimer = 1.5;
                            foodBeingEaten = targetFoodPiece;
                            targetFoodPiece = null;
                            playSpiderKickSound();
                        }
                    }
                }
            }

            // ---- RANDOM WEB SHOOT TRIGGER (idle play behaviour) ----
            if (!isEating && !isShootingWeb && !isFrontLegDancing && webShootCooldown <= 0 && Math.random() < 0.0015) {
                webShootCooldown = 8.0;
                isShootingWeb = true;
                webState = 'shooting';
                isJumping = false;
                isRandomWebShot = true;
                webTargetFood = null;

                // Pick a random target point inside the enclosure
                const limit = (boxSize / 2) - 2;
                const randomTargetPos = new THREE.Vector3(
                    (Math.random() - 0.5) * limit * 2,
                    Math.random() * (boxSize - 5) + 2,
                    (Math.random() - 0.5) * limit * 2
                );
                webTargetPos.copy(randomTargetPos);

                // Face the target direction
                const dirToTarget = new THREE.Vector3().subVectors(webTargetPos, spiderGroup.position);
                dirToTarget.y = 0;
                if (dirToTarget.lengthSq() > 0.001) {
                    const targetRot = Math.atan2(dirToTarget.x, dirToTarget.z);
                    spiderGroup.rotation.y = targetRot;
                }

                const spiderMouthPos = spiderGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));
                webProjectilePos.copy(spiderMouthPos);

                const toTarget = new THREE.Vector3().subVectors(webTargetPos, spiderMouthPos);
                const distance = toTarget.length();
                toTarget.normalize();
                webProjectileVel.copy(toTarget).multiplyScalar(Math.min(10 + distance * 0.2, 16));
                webProjectileVel.y = 2 + distance * 0.1;

                if (!webProjectileMesh) {
                    webProjectileMesh = new THREE.Mesh(webProjGeo, webProjMat);
                    scene.add(webProjectileMesh);
                }
                webProjectileMesh.position.copy(webProjectilePos);
                webProjectileMesh.visible = true;
            }
            // ---------------------------------------------

            if ((targetingBall || isChasingBall) && !isHoldingBall && grabbedObject !== 'ball' && !isFrontLegDancing && !isShootingWeb && (foodGroup.children.length === 0 || spiderHungryLevel >= 10)) {
                targetPosition.set(ball.position.x, 0, ball.position.z);
            }

            const toTarget = new THREE.Vector3().subVectors(targetPosition, spiderGroup.position);
            toTarget.y = 0;
            const distanceToTarget = toTarget.length();
            const isMoving = !isEating && !isShootingWeb && distanceToTarget >= 1.0 && !isFrontLegDancing;

            if (!isMoving && !isJumping && !isFrontLegDancing && !isEating && !isShootingWeb && !(activeTool === 'finger' && trackingCursor) && (foodGroup.children.length === 0 || spiderHungryLevel >= 10)) {
                if (!isChasingBall && Math.random() < 0.02) pickNewTarget();
            }

            if (isShootingWeb) {
                walkCycle = 0;

                // ==== ADDED: Force spider to stand on ground ====
                const currentGroundY = getTerrainHeight(spiderGroup.position.x, spiderGroup.position.z);
                spiderGroup.position.y = currentGroundY; // no walking bob, just flat on ground
                // ==============================================

                const spiderMouthPos = spiderGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));

                // For random web shots we don't need a food target, but we still need to check if we should cancel
                // If it's a random shot, keep going; otherwise validate the food target.
                if (!isRandomWebShot && (!webTargetFood || !foodGroup.children.includes(webTargetFood))) {
                    isShootingWeb = false;
                    webState = 'idle';
                    webTargetFood = null;
                    if (webLineMesh) {
                        scene.remove(webLineMesh);
                        webLineMesh.geometry.dispose();
                        webLineMesh = null;
                    }
                    if (webProjectileMesh) webProjectileMesh.visible = false;
                    isRandomWebShot = false;
                } else {
                    // Face the target (food or random point)
                    if (!isRandomWebShot && webTargetFood) {
                        const dirToFood = new THREE.Vector3().subVectors(webTargetFood.position, spiderGroup.position);
                        dirToFood.y = 0;
                        const targetRot = Math.atan2(dirToFood.x, dirToFood.z);
                        spiderGroup.rotation.y = THREE.MathUtils.lerp(spiderGroup.rotation.y, targetRot, 0.2);
                    } else if (isRandomWebShot) {
                        const dirToTarget = new THREE.Vector3().subVectors(webTargetPos, spiderGroup.position);
                        dirToTarget.y = 0;
                        const targetRot = Math.atan2(dirToTarget.x, dirToTarget.z);
                        spiderGroup.rotation.y = THREE.MathUtils.lerp(spiderGroup.rotation.y, targetRot, 0.2);
                    }

                    if (webState === 'shooting') {
                        webProjectileVel.y -= (gravity * 0.35) * delta;
                        webProjectilePos.addScaledVector(webProjectileVel, delta);

                        if (webProjectileMesh) {
                            webProjectileMesh.position.copy(webProjectilePos);
                            webProjectileMesh.visible = true;
                            webProjectileMesh.lookAt(camera.position);
                            webProjectileMesh.rotateZ(elapsedTime * 5);
                        }

                        const groundH = getTerrainHeight(webProjectilePos.x, webProjectilePos.z);
                        const boxLimit = boxSize / 2;
                        const innerLimit = boxLimit - 0.01;

                        let hitDetected = false;
                        let hitPosition = new THREE.Vector3().copy(webProjectilePos);
                        let surfaceNormal = new THREE.Vector3(0, 1, 0);

                        // Floor collision with terrain height
                        if (webProjectilePos.y <= groundH + 0.05) {
                            hitPosition.x = THREE.MathUtils.clamp(webProjectilePos.x, -innerLimit, innerLimit);
                            hitPosition.z = THREE.MathUtils.clamp(webProjectilePos.z, -innerLimit, innerLimit);
                            hitPosition.y = getTerrainHeight(hitPosition.x, hitPosition.z) + 0.02;
                            surfaceNormal = getTerrainNormal(hitPosition.x, hitPosition.z);
                            hitDetected = true;
                        } else if (webProjectilePos.y >= boxSize - 0.05) {
                            hitPosition.x = THREE.MathUtils.clamp(webProjectilePos.x, -innerLimit, innerLimit);
                            hitPosition.z = THREE.MathUtils.clamp(webProjectilePos.z, -innerLimit, innerLimit);
                            hitPosition.y = boxSize - 0.02;
                            surfaceNormal.set(0, -1, 0);
                            hitDetected = true;
                        } else if (Math.abs(webProjectilePos.x) >= innerLimit) {
                            hitPosition.x = Math.sign(webProjectilePos.x) * innerLimit;
                            hitPosition.y = THREE.MathUtils.clamp(webProjectilePos.y, 0.02, boxSize - 0.02);
                            hitPosition.z = THREE.MathUtils.clamp(webProjectilePos.z, -innerLimit, innerLimit);
                            surfaceNormal.set(-Math.sign(webProjectilePos.x), 0, 0);
                            hitDetected = true;
                        } else if (Math.abs(webProjectilePos.z) >= innerLimit) {
                            hitPosition.z = Math.sign(webProjectilePos.z) * innerLimit;
                            hitPosition.y = THREE.MathUtils.clamp(webProjectilePos.y, 0.02, boxSize - 0.02);
                            hitPosition.x = THREE.MathUtils.clamp(webProjectilePos.x, -innerLimit, innerLimit);
                            surfaceNormal.set(0, 0, -Math.sign(webProjectilePos.z));
                            hitDetected = true;
                        }

                        if (hitDetected) {
                            const landedWeb = new THREE.Mesh(webProjGeo, webProjMat.clone());
                            landedWeb.position.copy(hitPosition);

                            const targetOrientation = new THREE.Matrix4();
                            const fakeUp = Math.abs(surfaceNormal.y) > 0.9 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
                            targetOrientation.lookAt(hitPosition, hitPosition.clone().add(surfaceNormal), fakeUp);
                            landedWeb.quaternion.setFromRotationMatrix(targetOrientation);

                            landedWeb.userData = { isLandedWeb: true, health: 1.0 };
                            scene.add(landedWeb);
                            landedWebs.push(landedWeb);

                            if (activeTool === 'brush') {
                                addHighlightToObject(landedWeb);
                            }

                            if (webProjectileMesh) webProjectileMesh.visible = false;

                            isShootingWeb = false;
                            webState = 'idle';
                            webTargetFood = null;
                            isRandomWebShot = false;

                            if (webLineMesh) {
                                scene.remove(webLineMesh);
                                webLineMesh.geometry.dispose();
                                webLineMesh = null;
                            }
                        } else if (webProjectilePos.distanceTo(spiderMouthPos) > 30) {
                            isShootingWeb = false;
                            webState = 'idle';
                            webTargetFood = null;
                            isRandomWebShot = false;
                            if (webLineMesh) {
                                scene.remove(webLineMesh);
                                webLineMesh.geometry.dispose();
                                webLineMesh = null;
                            }
                            if (webProjectileMesh) webProjectileMesh.visible = false;
                        }

                        if (webState === 'shooting') {
                            const points = [spiderMouthPos, webProjectilePos];
                            const webGeo = new THREE.BufferGeometry().setFromPoints(points);
                            if (!webLineMesh) {
                                webLineMesh = new THREE.Line(webGeo, webLineMaterial);
                                scene.add(webLineMesh);
                            } else {
                                webLineMesh.geometry.dispose();
                                webLineMesh.geometry = webGeo;
                            }
                        }
                    } else if (webState === 'pulling') {
                        if (webProjectileMesh) webProjectileMesh.visible = false;

                        webTargetFood.position.lerp(spiderMouthPos, delta * 4.0);
                        if (webTargetFood.userData && webTargetFood.userData.velocity) {
                            webTargetFood.userData.velocity.set(0, 0, 0);
                        }

                        const points = [spiderMouthPos, webTargetFood.position];
                        const webGeo = new THREE.BufferGeometry().setFromPoints(points);
                        if (!webLineMesh) {
                            webLineMesh = new THREE.Line(webGeo, webLineMaterial);
                            scene.add(webLineMesh);
                        } else {
                            webLineMesh.geometry.dispose();
                            webLineMesh.geometry = webGeo;
                        }

                        if (spiderMouthPos.distanceTo(webTargetFood.position) < 1.5) {
                            isShootingWeb = false;
                            webState = 'idle';
                            if (webLineMesh) {
                                scene.remove(webLineMesh);
                                webLineMesh.geometry.dispose();
                                webLineMesh = null;
                            }
                            if (webProjectileMesh) webProjectileMesh.visible = false;

                            isEating = true;
                            eatingTimer = 1.5;
                            foodBeingEaten = webTargetFood;
                            webTargetFood = null;
                            isRandomWebShot = false;
                            playSpiderKickSound();
                        }
                    }
                }
            } else if (isEating) {
                eatingTimer -= delta;
                walkCycle = 0;

                const chewPhase = eatingTimer * 15;
                spiderBodyContainer.position.y = Math.abs(Math.sin(chewPhase)) * 0.15;
                leftPedipalp.rotation.z = Math.sin(chewPhase * 2) * 0.2;
                rightPedipalp.rotation.z = -Math.sin(chewPhase * 2) * 0.2;

                if (Math.random() < 0.2) {
                    spawnEmotionParticle();
                }

                if (foodBeingEaten && foodGroup.children.includes(foodBeingEaten)) {
                    foodBeingEaten.scale.multiplyScalar(0.96);
                }

                if (eatingTimer <= 0) {
                    isEating = false;
                    spiderBodyContainer.position.y = 0;

                    if (foodBeingEaten && foodGroup.children.includes(foodBeingEaten)) {
                        const isInsect = foodBeingEaten.userData && foodBeingEaten.userData.isInsect;
                        const recoveryAmount = isInsect ? 3 : 1;

                        createFoodPopup(spiderGroup.position, recoveryAmount);

                        removeHighlightFromObject(foodBeingEaten);
                        foodGroup.remove(foodBeingEaten);
                        if (foodBeingEaten === activeInsect) {
                            activeInsect = null;
                        }
                        foodBeingEaten = null;

                        spiderHungryLevel = Math.min(10, spiderHungryLevel + recoveryAmount);
                        hungerTimerSeconds = 15;
                        updateSpiderHungerDisplay();
                    }
                    pickNewTarget();
                }
            } else if (grabbedObject === 'spider') {
                spiderLegs.forEach((leg) => {
                    leg.femurPivot.rotation.x = leg.baseFemurX + 0.3;
                    leg.tibiaPivot.rotation.x = leg.baseTibiaX + 0.4;
                });
            } else if (isJumping) {
                jumpProgress += delta * 1.0;
                if (jumpProgress > 1) jumpProgress = 1;

                const jumpDir = new THREE.Vector3().subVectors(targetPosition, startJumpPos);
                jumpDir.y = 0;
                if (jumpDir.lengthSq() > 0.001) {
                    const targetRot = Math.atan2(jumpDir.x, jumpDir.z);
                    spiderGroup.rotation.y = THREE.MathUtils.lerp(spiderGroup.rotation.y, targetRot, 0.2);
                }

                spiderGroup.position.lerpVectors(startJumpPos, targetPosition, jumpProgress);

                const targetGroundY = getTerrainHeight(spiderGroup.position.x, spiderGroup.position.z);
                const jumpHeight = 3.0;
                spiderGroup.position.y = targetGroundY + Math.sin(jumpProgress * Math.PI) * jumpHeight;

                spiderLegs.forEach((leg) => {
                    leg.femurPivot.rotation.x = THREE.MathUtils.lerp(leg.femurPivot.rotation.x, leg.baseFemurX - 0.5, 0.1);
                    leg.tibiaPivot.rotation.x = THREE.MathUtils.lerp(leg.tibiaPivot.rotation.x, leg.baseTibiaX + 0.6, 0.1);
                });

                if (jumpProgress === 1) {
                    isJumping = false;
                    if (getTerrainHeight(spiderGroup.position.x, spiderGroup.position.z) < waterLevel) {
                        triggerSplash(spiderGroup.position);
                    }
                }
            } else {
                if (isMoving) {
                    idleTime = 0;
                    const targetRotation = Math.atan2(toTarget.x, toTarget.z);
                    let currentRotation = spiderGroup.rotation.y;

                    let diff = targetRotation - currentRotation;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;

                    spiderGroup.rotation.y += diff * Math.min(1.0, delta * 4.0);

                    const forwardDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), spiderGroup.rotation.y);
                    spiderGroup.position.addScaledVector(forwardDir, spiderSpeed);

                    walkCycle += delta * (spiderSpeed * 200);
                } else {
                    walkCycle = 0;
                    if (!isFrontLegDancing && !isChasingBall) {
                        idleTime += delta;
                        if (idleTime > 2.0 && Math.random() < 0.005) {
                            isFrontLegDancing = true;
                            danceTimer = 0;
                        }
                    }

                    if (isFrontLegDancing) {
                        danceTimer += delta;
                        if (danceTimer > 4.0) {
                            isFrontLegDancing = false;
                            idleTime = 0;
                        }
                    }
                }

                const currentGroundY = getTerrainHeight(spiderGroup.position.x, spiderGroup.position.z);
                const walkBob = isMoving ? Math.abs(Math.sin(walkCycle * 1.5)) * 0.15 : 0;
                spiderGroup.position.y = THREE.MathUtils.lerp(spiderGroup.position.y, currentGroundY + walkBob, 0.2);

                if (!isMoving && !isFrontLegDancing) {
                    const breath = Math.sin(idleTime * 2.5) * 0.04;
                    const lookAround = Math.sin(idleTime * 1.0) * 0.05;

                    spiderBodyContainer.position.y = breath;
                    spiderBodyContainer.rotation.x = breath * 0.5;
                    spiderBodyContainer.rotation.y = lookAround;

                    leftPedipalp.rotation.z = Math.sin(idleTime * 6) * 0.05;
                    rightPedipalp.rotation.z = -Math.sin(idleTime * 6) * 0.05;
                } else {
                    spiderBodyContainer.position.y = THREE.MathUtils.lerp(spiderBodyContainer.position.y, 0, 0.2);
                    spiderBodyContainer.rotation.x = THREE.MathUtils.lerp(spiderBodyContainer.rotation.x, 0, 0.2);
                    spiderBodyContainer.rotation.y = THREE.MathUtils.lerp(spiderBodyContainer.rotation.y, 0, 0.2);
                }

                spiderLegs.forEach((leg) => {
                    const isFrontLeg = (leg.index === 0 || leg.index === 1);

                    if (isFrontLegDancing && isFrontLeg) {
                        const sideMultiplier = (leg.index === 0) ? 1 : -1;
                        const dancePhase = danceTimer * 8;

                        leg.femurPivot.rotation.x = -1.0 + Math.sin(dancePhase) * 0.2;
                        leg.tibiaPivot.rotation.x = 0.2 + Math.cos(dancePhase * 1.3) * 0.2;
                        leg.root.rotation.y = leg.baseYaw + (0.4 * sideMultiplier) + Math.sin(dancePhase * 0.7) * 0.2;
                    } else {
                        const uniqueOffset = leg.index * 0.785;
                        const cycle = (isMoving ? walkCycle : 0) + uniqueOffset;

                        const rawCycleVal = Math.sin(cycle);
                        const stepUp = Math.max(0, rawCycleVal);
                        const stepForward = Math.cos(cycle) * 0.3;

                        const footWorldPos = new THREE.Vector3(leg.xSide * 1.4, 0, leg.localRestZ + stepForward);
                        footWorldPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), spiderGroup.rotation.y);
                        footWorldPos.add(spiderGroup.position);

                        const exactFloorY = getTerrainHeight(footWorldPos.x, footWorldPos.z) + 0.02;

                        const isFootInWater = exactFloorY < waterLevel;
                        if (isFootInWater && !leg.wasInWater && stepUp < 0.1) {
                            triggerSplash(footWorldPos);
                        }
                        leg.wasInWater = isFootInWater;

                        const groundLocalY = exactFloorY - spiderGroup.position.y - 0.78;
                        const idleBreathOffset = !isMoving ? Math.sin(idleTime * 2.5 + leg.index) * 0.03 : 0;

                        const targetY = (groundLocalY / Math.cos(leg.femurPivot.rotation.z)) + stepUp * 0.45;
                        const targetZ = 1.6 + stepForward;

                        const L1 = 1.4;
                        const L2 = 1.4;
                        const D = Math.sqrt(targetY * targetY + targetZ * targetZ);
                        const D_clamped = Math.min(D, L1 + L2 - 0.001);

                        const alpha = Math.acos((L1 * L1 + D_clamped * D_clamped - L2 * L2) / (2 * L1 * D_clamped));
                        const beta = Math.acos((L1 * L1 + L2 * L2 - D_clamped * D_clamped) / (2 * L1 * L2));

                        const theta_down = Math.atan2(-targetY, targetZ);

                        leg.femurPivot.rotation.x = theta_down - alpha + idleBreathOffset;
                        leg.tibiaPivot.rotation.x = Math.PI - beta - idleBreathOffset;

                        leg.root.rotation.y = leg.baseYaw + (stepForward * 0.1);
                    }
                });
            }

            if (!isHoldingBall && grabbedObject !== 'spider' && grabbedObject !== 'ball') {
                const spiderCenter = spiderGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));
                const spiderRadius = 1.3;
                const minDistance = spiderRadius + ballRadius;

                const toBall = new THREE.Vector3().subVectors(ball.position, spiderCenter);
                const currentDist = toBall.length();

                if (currentDist < minDistance) {
                    toBall.normalize();
                    ball.position.copy(spiderCenter).addScaledVector(toBall, minDistance);

                    const pushDir = toBall.clone();
                    pushDir.y += 0.3;
                    pushDir.normalize();

                    const hitForce = playBallRequested ? (12 + Math.random() * 16) : (isJumping ? 18 : 10);
                    ballVelocity.add(pushDir.multiplyScalar(hitForce));

                    playSpiderKickSound();

                    if (playBallRequested) {
                        playBallRequested = false;
                        targetingBall = false;
                    }
                    pickNewTarget();
                }
            }

            if (cameraMode === 'follow') {
                const targetCamTarget = spiderGroup.position.clone().add(new THREE.Vector3(0, 1, 0));
                controls.target.lerp(targetCamTarget, 0.1);
                controls.update();
            } else if (cameraMode === 'fpv') {
                spiderGroup.updateMatrixWorld(true);

                const eyeLocal = new THREE.Vector3(0, 1.3, 6.0);
                const eyeWorld = eyeLocal.clone().applyMatrix4(spiderGroup.matrixWorld);
                camera.position.copy(eyeWorld);

                const lookAtLocal = new THREE.Vector3(0, 1.3, 11.5);
                const lookAtWorld = lookAtLocal.clone().applyMatrix4(spiderGroup.matrixWorld);
                camera.lookAt(lookAtWorld);
                controls.target.copy(lookAtWorld);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
