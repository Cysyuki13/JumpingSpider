<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Jumping Spider Pet - Enhanced Alive Insect</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #sidebar {
            position: absolute;
            top: 20px;
            right: 0;
            width: 70px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 12px 0 0 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: -4px 8px 32px rgba(0, 0, 0, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.collapsed {
            transform: translateX(calc(50% + 15px));
        }

        #sidebar.collapsed:hover {
            transform: translateX(calc(50%));
            cursor: pointer;
        }

        #left-sidebar {
            position: absolute;
            top: 20px;
            left: 0;
            width: 80px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 0 12px 12px 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 4px 8px 32px rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #left-sidebar.collapsed {
            transform: translateX(calc(-50% - 15px));
        }

        #left-sidebar.collapsed:hover {
            transform: translateX(calc(-50%));
            cursor: pointer;
        }

        /* Bottom Information Menu */
        #bottom-info-menu {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 12px 12px 0 0;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 -4px 32px rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            color: white;
            font-size: 13px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #bottom-info-menu.collapsed {
            transform: translate(-50%, calc(50% + 15px));
        }

        #bottom-info-menu.collapsed:hover {
            transform: translate(-50%, calc(50%));
            cursor: pointer;
        }

        #bottom-info-menu.collapsed #btn-bottom-toggle {
            display: none;
        }

        .info-content {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: center;
        }

        .info-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .info-header-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            gap: 15px;
        }

        #spider-hunger-bar {
            font-family: monospace;
            font-size: 15px;
            letter-spacing: 1px;
            color: #ff4757;
            font-weight: bold;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .btn-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .tool-btn {
            width: 50px;
            height: 45px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .tool-btn.active {
            background: #ff3366;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
        }

        #btn-toggle {
            height: 25px;
            font-size: 16px;
            align-self: center;
        }

        #btn-left-toggle {
            height: 25px;
            font-size: 16px;
            width: 50px;
            align-self: center;
        }

        #btn-bottom-toggle {
            height: 25px;
            font-size: 16px;
            width: 50px;
            align-self: center;
        }

        #btn-exit-cam {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(255, 51, 102, 0.85);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        #btn-exit-cam:hover {
            background: rgba(255, 51, 102, 1);
            transform: translateX(-50%) scale(1.05);
        }

        #feed-menu {
            position: absolute;
            top: 20px;
            right: 85px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .feed-option-btn {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .feed-option-btn:hover {
            background: #ff3366;
        }

        #time-control-panel {
            position: fixed;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 220px;
        }

        #time-control-panel label {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        #time-slider {
            width: 100%;
            cursor: pointer;
            accent-color: #ff3366;
        }
    </style>
</head>

<body>
    <button id="btn-exit-cam">Exit Camera Mode</button>

    <div id="feed-menu">

    <div id="time-control-panel">
        <label><span>Time of Day</span><span id="time-text">12:00 PM</span></label>
        <input type="range" id="time-slider" min="0" max="24" step="0.1" value="12">
    </div>

    <div id="left-sidebar">
        <button id="btn-left-toggle" class="tool-btn" title="Toggle Setting Menu">◀</button>
        <div class="menu-item">
            <button id="btn-dance" class="tool-btn" title="Force Dance">💃</button>

        <div class="menu-item">

        <div class="menu-item">
            <button id="btn-time-system" class="tool-btn" title="Day/Night System">🌙</button>

    <div id="sidebar">
        <button id="btn-toggle" class="tool-btn" title="Toggle Tool Menu">▶</button>
        <div class="menu-item">
            <button id="btn-fullscreen" class="tool-btn" title="Toggle Fullscreen">⛶</button>

    <div id="bottom-info-menu">
        <button id="btn-bottom-toggle" class="tool-btn" title="Toggle Information Menu">▼</button>
        <div class="info-content">
            <span id="spider-emotion-status">🕷️ Active (Neutral)</span>
            <span>•</span>
            <div class="info-section">
                <div class="info-header-row">
                    <span>Hungry</span>
                    <span id="hunger-timer-display" style="color: #ffaa00; font-family: monospace;">00:20</span>
                    <span id="spider-hunger-text">10 / 10</span>
                </div>
                <div id="spider-hunger-bar">||||||||||</div>
            </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSpiderKickSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playBounceSound(intensity = 1.0) {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const baseFreq = 120 * Math.min(Math.max(intensity, 0.2), 2.0);
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2 * Math.min(intensity, 1.0), audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playClickSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#222222');

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 25, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        const d = 20;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        scene.add(dirLight);

        const boxSize = 20;
        const glassGeometry = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const glassMaterial = new THREE.MeshStandardMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.15,
            roughness: 0.1,
            metalness: 0.1,
            side: THREE.BackSide,
            depthWrite: false
        });
        const glassCube = new THREE.Mesh(glassGeometry, glassMaterial);
        glassCube.position.y = boxSize / 2;
        scene.add(glassCube);

        const edges = new THREE.EdgesGeometry(glassGeometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.3, transparent: true });
        const boxEdges = new THREE.LineSegments(edges, lineMaterial);
        boxEdges.position.y = boxSize / 2;
        scene.add(boxEdges);

        function getTerrainHeight(x, z) {
            const edgeDistanceX = (boxSize / 2) - Math.abs(x);
            const edgeDistanceZ = (boxSize / 2) - Math.abs(z);
            const edgeFactor = Math.min(1.0, Math.max(0, Math.min(edgeDistanceX, edgeDistanceZ) / 2.0));

            return (Math.sin(x * 0.35) * Math.cos(z * 0.35) * 0.6 +
                Math.sin(x * 0.8) * Math.sin(z * 0.7) * 0.25 +
                Math.cos(x * 1.5 + z * 1.5) * 0.1) * edgeFactor;
        }

        function getTerrainNormal(x, z) {
            const eps = 0.1;
            const hL = getTerrainHeight(x - eps, z);
            const hR = getTerrainHeight(x + eps, z);
            const hD = getTerrainHeight(x, z - eps);
            const hU = getTerrainHeight(x, z + eps);
            const normal = new THREE.Vector3(hL - hR, 2.0 * eps, hD - hU);
            normal.normalize();
            return normal;
        }

        function createSoilTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#24170e';
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 55000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const radius = Math.random() * 2.2;
                const shade = Math.random();
                if (shade < 0.5) ctx.fillStyle = 'rgba(30, 18, 8, 0.5)';
                else if (shade < 0.8) ctx.fillStyle = 'rgba(75, 50, 28, 0.45)';
                else if (shade < 0.95) ctx.fillStyle = 'rgba(115, 85, 55, 0.35)';
                else ctx.fillStyle = 'rgba(140, 120, 100, 0.4)';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(5, 5);
            return texture;
        }

        const floorGeo = new THREE.PlaneGeometry(boxSize, boxSize, 48, 48);
        const posAttribute = floorGeo.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            const vx = posAttribute.getX(i);
            const vy = posAttribute.getY(i);
            posAttribute.setZ(i, getTerrainHeight(vx, vy));
        }
        floorGeo.computeVertexNormals();

        const floorMat = new THREE.MeshStandardMaterial({
            map: createSoilTexture(),
            roughness: 0.85,
            metalness: 0.05
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0.02;
        floor.receiveShadow = true;
        scene.add(floor);

        const waterLevel = -0.25;
        const waterGeo = new THREE.PlaneGeometry(boxSize - 1, boxSize - 1, 32, 32);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x2288ff,
            transparent: true,
            opacity: 0.65,
            roughness: 0.1,
            metalness: 0.8
        });
        const waterLayer = new THREE.Mesh(waterGeo, waterMat);
        waterLayer.rotation.x = -Math.PI / 2;
        waterLayer.position.y = waterLevel + 0.04;
        scene.add(waterLayer);

        const activeRipples = [];
        const rippleGeo = new THREE.RingGeometry(0.05, 0.12, 16);
        const rippleMatTemplate = new THREE.MeshBasicMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide
        });

        function triggerSplash(pos) {
            if (getTerrainHeight(pos.x, pos.z) < waterLevel) {
                const rippleMesh = new THREE.Mesh(rippleGeo, rippleMatTemplate.clone());
                rippleMesh.rotation.x = -Math.PI / 2;
                rippleMesh.position.set(pos.x, waterLevel + 0.06, pos.z);
                scene.add(rippleMesh);
                activeRipples.push({ mesh: rippleMesh, life: 1.0 });
            }
        }

        const activePopups = [];

        function createFoodPopup(pos, points) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 64);
            ctx.font = 'bold 36px sans-serif';
            ctx.fillStyle = points >= 3 ? '#ff3366' : '#ffd700';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('+' + points, 64, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.copy(pos).add(new THREE.Vector3(0, 2.0, 0));
            sprite.scale.set(1.5, 0.75, 1);
            scene.add(sprite);

            activePopups.push({
                sprite: sprite,
                life: 1.0,
                velocity: new THREE.Vector3(0, 1.2, 0)
            });
        }

        const ballRadius = 1;
        const ballGeo = new THREE.SphereGeometry(ballRadius, 16, 16);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.4 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(5, ballRadius + 2, -5);
        ball.castShadow = true;
        scene.add(ball);

        const ballVelocity = new THREE.Vector3(0, 0, 0);
        const gravity = 22;
        const airDrag = 0.992;
        const bounceFactor = 0.45;
        const surfaceFriction = 0.94;

        let isHoldingBall = false;
        let chargeTime = 0;
        const ballOriginalPos = new THREE.Vector3();
        let ballWasInWater = false;

        let activeInsect = null;
        let spiderHungryLevel = 5;
        let hungerTimerSeconds = 10;
        const foodGroup = new THREE.Group();
        scene.add(foodGroup);
        let targetFoodPiece = null;

        let isEating = false;
        let eatingTimer = 0;
        let foodBeingEaten = null;

        // Web shooting & pulling state variables
        let isShootingWeb = false;
        let webTargetFood = null;
        let webLineMesh = null;
        const webLineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });

        const landedWebs = [];

        // Generate a realistic spider web texture (matching the shape of the reference image)
        function createWebTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const cx = 256;
            const cy = 256;
            const maxRadius = 240;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; // White web for visibility in the dark
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const numRadials = 8;
            const numSpirals = 5;

            // Draw straight radial threads
            ctx.beginPath();
            for (let i = 0; i < numRadials; i++) {
                const angle = (i / numRadials) * Math.PI * 2;
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(angle) * maxRadius, cy + Math.sin(angle) * maxRadius);
            }
            ctx.stroke();

            // Draw spiraling threads with sagging curves
            for (let j = 1; j <= numSpirals; j++) {
                const r = (j / numSpirals) * (maxRadius * 0.95);
                ctx.beginPath();
                for (let i = 0; i <= numRadials; i++) {
                    const angle = (i / numRadials) * Math.PI * 2;
                    const nextAngle = ((i + 1) / numRadials) * Math.PI * 2;

                    const x1 = cx + Math.cos(angle) * r;
                    const y1 = cy + Math.sin(angle) * r;
                    const x2 = cx + Math.cos(nextAngle) * r;
                    const y2 = cy + Math.sin(nextAngle) * r;

                    if (i === 0) ctx.moveTo(x1, y1);

                    if (i < numRadials) {
                        // Sag factor pulls the curve slightly inward toward the center
                        const sagFactor = 0.85;
                        const midAngle = (angle + nextAngle) / 2;
                        const midX = cx + Math.cos(midAngle) * (r * sagFactor);
                        const midY = cy + Math.sin(midAngle) * (r * sagFactor);

                        ctx.quadraticCurveTo(midX, midY, x2, y2);
                    }
                }
                ctx.stroke();
            }

            return new THREE.CanvasTexture(canvas);
        }

                spiderEmotion = spiderHungryLevel <= 1 ? 'annoyed' : 'sad';
            } else if (isEating || isShootingWeb) {
                spiderEmotion = 'happy';

            }

            if (spiderEmotion === 'happy') {
                statusEl.textContent = '🕷️ Happy 🥰';
                statusEl.style.color = '#ff6b81';
            } else if (spiderEmotion === 'sad') {
                statusEl.textContent = '🕷️ Hungry & Sad 💧';
                statusEl.style.color = '#70a1ff';
            } else if (spiderEmotion === 'annoyed') {
                statusEl.textContent = '🕷️ Starving & Annoyed 💢';
                statusEl.style.color = '#ff4757';
            } else {
                statusEl.textContent = '🕷️ Active (Neutral)';

        function spawnEmotionParticle() {
            if (spiderEmotion === 'neutral') return;

            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);
            ctx.font = 'bold 52px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let symbol = '';
            if (spiderEmotion === 'happy') {
                symbol = '♥';
                ctx.fillStyle = '#ff3366';
            } else if (spiderEmotion === 'sad') {
                const sadSymbols = ['#', '?', '...', '-_-', '~'];
                symbol = sadSymbols[Math.floor(Math.random() * sadSymbols.length)];
                ctx.fillStyle = '#70a1ff';
            } else if (spiderEmotion === 'annoyed') {
                const symbolPool = ['#', '&', '!', '?', '#!?', '&?!', '!?#', '?!'];
                const count = Math.floor(Math.random() * 2) + 1;
                symbol = '';
                for (let i = 0; i < count; i++) {
                    symbol += symbolPool[Math.floor(Math.random() * symbolPool.length)];
                }
                ctx.fillStyle = '#ff4757';
            }

            ctx.fillText(symbol, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
            const sprite = new THREE.Sprite(spriteMat);

            const offset = new THREE.Vector3((Math.random() - 0.5) * 0.8, 2.2 + Math.random() * 0.5, (Math.random() - 0.5) * 0.8);
            sprite.position.copy(spiderGroup.position).add(offset);
            sprite.scale.set(0.8, 0.8, 0.8);
            scene.add(sprite);

            emotionParticles.push({
                sprite: sprite,
                life: 1.0,
                velocity: new THREE.Vector3((Math.random() - 0.5) * 0.5, 1.0 + Math.random() * 0.5, (Math.random() - 0.5) * 0.5)
            });
        }

            const timerDisplay = document.getElementById('hunger-timer-display');

            if (bar && text) {
                const activePipes = '|'.repeat(level);
                const emptyPipes = '-'.repeat(10 - level);
                bar.textContent = activePipes + emptyPipes;
                text.textContent = `${level} / 10`;

            if (timerDisplay) {
                const mins = Math.floor(hungerTimerSeconds / 60);
                const secs = hungerTimerSeconds % 60;

            if (!obj) return;

            if (obj.isGroup) {
                obj.children.forEach(child => {
                    if (child.isMesh) {
                        addHighlightToObject(child);
                    } else if (child.isGroup) {
                        addHighlightToObject(child);
                    }
                });
                return;
            }

            if (obj.isMesh) {
                if (obj.userData.highlight) return;
                try {
                    const edges = new THREE.EdgesGeometry(obj.geometry);
                    const material = new THREE.LineBasicMaterial({
                        color: 0x00ffff,
                        transparent: true,
                        opacity: 0.7,
                        depthTest: false,
                    });
                    const wireframe = new THREE.LineSegments(edges, material);
                    wireframe.position.set(0, 0, 0);
                    wireframe.renderOrder = 999;
                    obj.add(wireframe);
                    obj.userData.highlight = wireframe;
                } catch (e) {
                    console.warn('Could not create highlight for object:', obj);
                }
                return;
            }
        }

        function removeHighlightFromObject(obj) {
            if (!obj) return;

            if (obj.isGroup) {
                obj.children.forEach(child => {
                    if (child.isMesh || child.isGroup) {
                        removeHighlightFromObject(child);
                    }
                });
                return;
            }

            if (obj.isMesh && obj.userData.highlight) {
                const h = obj.userData.highlight;
                obj.remove(h);
                if (h.geometry) h.geometry.dispose();
                if (h.material) h.material.dispose();
                obj.userData.highlight = null;
            }
        }

        function updateLightingSystem(hour) {
            const h = Math.floor(hour);
            const m = Math.floor((hour - h) * 60);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const displayHour = h % 12 === 0 ? 12 : h % 12;
            const displayMin = m < 10 ? '0' + m : m;
            timeText.textContent = `${displayHour}:${displayMin} ${ampm}`;

            const angle = (hour / 24) * Math.PI * 2 - Math.PI / 2;
            const radius = 30;
            dirLight.position.x = Math.cos(angle) * radius;
            dirLight.position.y = Math.sin(angle) * radius;
            dirLight.position.z = 10;

            let skyColor, bgHex, ambientIntensity, dirIntensity;

            if (hour >= 5 && hour < 7) {
                const t = (hour - 5) / 2;
                skyColor = new THREE.Color().lerpColors(new THREE.Color(0x0b1329), new THREE.Color(0xff8c42), t);
                bgHex = new THREE.Color().lerpColors(new THREE.Color(0x080c14), new THREE.Color(0x382216), t);
                ambientIntensity = THREE.MathUtils.lerp(0.1, 0.4, t);
                dirIntensity = THREE.MathUtils.lerp(0.1, 0.5, t);
            } else if (hour >= 7 && hour < 17) {
                skyColor = new THREE.Color(0xffffff);
                bgHex = new THREE.Color(0x222222);
                ambientIntensity = 0.6;
                dirIntensity = 0.8;
            } else if (hour >= 17 && hour < 19) {
                const t = (hour - 17) / 2;
                skyColor = new THREE.Color().lerpColors(new THREE.Color(0xffffff), new THREE.Color(0xff4500), t);
                bgHex = new THREE.Color().lerpColors(new THREE.Color(0x222222), new THREE.Color(0x200c14), t);
                ambientIntensity = THREE.MathUtils.lerp(0.6, 0.2, t);
                dirIntensity = THREE.MathUtils.lerp(0.8, 0.3, t);
            } else {
                skyColor = new THREE.Color(0x446699);
                bgHex = new THREE.Color(0x080c14);
                ambientIntensity = 0.15;
                dirIntensity = 0.1;
            }

            scene.background = bgHex;
            ambientLight.color = skyColor;
            ambientLight.intensity = ambientIntensity;
            dirLight.color = skyColor;
            dirLight.intensity = Math.max(0, dirLight.position.y > 0 ? dirIntensity : 0.05);
        }

        const raycaster = new THREE.Raycaster();

        function cleanWithBrush(event) {
            if (activeTool !== 'brush') return;
            if (event.button !== 0 && event.pointerType === 'mouse') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            let cleaned = false;

            if (landedWebs.length > 0) {
                const webIntersects = raycaster.intersectObjects(landedWebs);
                for (let i = 0; i < webIntersects.length; i++) {
                    const web = webIntersects[i].object;
                    removeHighlightFromObject(web);
                    scene.remove(web);
                    const idx = landedWebs.indexOf(web);
                    if (idx !== -1) landedWebs.splice(idx, 1);
                    cleaned = true;
                }
            }

            const foodMeshes = [];
            foodGroup.children.forEach(child => {
                child.traverse(node => {
                    if (node.isMesh) foodMeshes.push(node);
                });
            });
            if (foodMeshes.length > 0) {
                const foodIntersects = raycaster.intersectObjects(foodMeshes);
                for (let i = 0; i < foodIntersects.length; i++) {
                    let rootFood = foodIntersects[i].object;
                    while (rootFood.parent && rootFood.parent !== foodGroup) {
                        rootFood = rootFood.parent;
                    }
                    if (foodGroup.children.includes(rootFood)) {
                        if (foodBeingEaten === rootFood) {
                            foodBeingEaten = null;
                            isEating = false;
                            eatingTimer = 0;
                        }
                        if (webTargetFood === rootFood) {
                            webTargetFood = null;
                            isShootingWeb = false;
                            webState = 'idle';
                            if (webLineMesh) {
                                scene.remove(webLineMesh);
                                webLineMesh.geometry.dispose();
                                webLineMesh = null;
                            }
                            if (webProjectileMesh) webProjectileMesh.visible = false;
                        }
                        if (targetFoodPiece === rootFood) {
                            targetFoodPiece = null;
                        }
                        if (activeInsect === rootFood) {
                            activeInsect = null;
                        }
                        removeHighlightFromObject(rootFood);
                        foodGroup.remove(rootFood);
                        cleaned = true;
                        playClickSound();
                    }
                }
            }

            if (cleaned) {
                playClickSound();
            }
        }

        window.addEventListener('pointerdown', (event) => {
            if (activeTool === 'brush') {
                cleanWithBrush(event);
                return;
            }

            if (event.button !== 0 && event.pointerType === 'mouse') return;
            if (event.clientX < 90 && event.clientY < 340) return;
            if (event.clientX > window.innerWidth - 90 && event.clientY < 260) return;
            if (timeControlPanel.contains(event.target) || feedMenu.contains(event.target)) return;

            if (holdingFoodType) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                cursorPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));

                if (raycaster.ray.intersectPlane(cursorPlane, cursorWorldPos)) {
                    playClickSound();
                    const limit = (boxSize / 2) - 1.5;
                    const dropX = Math.max(-limit, Math.min(limit, cursorWorldPos.x));

                    const dropPos = new THREE.Vector3(dropX, 0, dropZ);

                    if (holdingFoodType === 'insect') {

            if (!activeTool) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const spiderMeshes = [];
            spiderGroup.traverse(child => { if (child.isMesh) spiderMeshes.push(child); });

            const spiderIntersect = raycaster.intersectObjects(spiderMeshes);
            const ballIntersect = raycaster.intersectObject(ball);

            let foodIntersect = [];
            const foodMeshes = [];
            foodGroup.traverse(child => { if (child.isMesh) foodMeshes.push(child); });
            foodIntersect = raycaster.intersectObjects(foodMeshes);

            if (activeTool === 'finger') {
                if (spiderIntersect.length > 0) {
                    playClickSound();
                    playSpiderKickSound();

                    startJumpPos.copy(spiderGroup.position);
                    jumpProgress = 0;
                    isJumping = true;
                    trackingCursor = false;
                    targetingBall = false;
                    playBallRequested = false;
                    isFrontLegDancing = false;
                    isShootingWeb = false;
                    webState = 'idle';
                } else if (ballIntersect.length > 0) {
                    playClickSound();
                    isHoldingBall = true;
                    chargeTime = 0;
                    ballOriginalPos.copy(ball.position);
                    ballVelocity.set(0, 0, 0);
                    if (cameraMode !== 'fpv') controls.enabled = false;
                    trackingCursor = false;
                } else if (foodIntersect.length > 0 && !isEating && !isShootingWeb) {
                    playClickSound();
                    let rootFood = foodIntersect[0].object;
                    while (rootFood.parent && rootFood.parent !== foodGroup) {
                        rootFood = rootFood.parent;
                    }

                    if (webShootCooldown <= 0) {
                        webTargetFood = rootFood;
                        isShootingWeb = true;
                        webState = 'shooting';
                        webShootCooldown = 6.0;
                        isJumping = false;
                        isFrontLegDancing = false;
                        trackingCursor = false;
                        isRandomWebShot = false;

                        const spiderMouthPos = spiderGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));
                        webProjectilePos.copy(spiderMouthPos);
                        const toTarget = new THREE.Vector3().subVectors(webTargetFood.position, spiderMouthPos);
                        const distance = toTarget.length();
                        toTarget.normalize();
                        webProjectileVel.copy(toTarget).multiplyScalar(Math.min(10 + distance * 0.2, 16));
                        webProjectileVel.y = 2 + distance * 0.1;

                        if (!webProjectileMesh) {
                            webProjectileMesh = new THREE.Mesh(webProjGeo, webProjMat);
                            scene.add(webProjectileMesh);
                        }
                        webProjectileMesh.position.copy(webProjectilePos);

                        isFrontLegDancing = false;
                        trackingCursor = false;
                    }
                } else {
                    playClickSound();
                    trackingCursor = true;
                    targetingBall = false;
                    playBallRequested = false;
                    isJumping = false;
                    isFrontLegDancing = false;
                }
            } else if (activeTool === 'grab') {
                if (spiderIntersect.length > 0) {
                    grabbedObject = 'spider';
                    isJumping = false;
                    isFrontLegDancing = false;
                    isShootingWeb = false;
                    webState = 'idle';
                    if (cameraMode !== 'fpv') controls.enabled = false;
                } else if (ballIntersect.length > 0) {
                    grabbedObject = 'ball';
                    ballVelocity.set(0, 0, 0);
                    if (cameraMode !== 'fpv') controls.enabled = false;
                } else if (foodIntersect.length > 0) {
                    grabbedObject = 'food';
                    let rootFood = foodIntersect[0].object;
                    while (rootFood.parent && rootFood.parent !== foodGroup) {
                        rootFood = rootFood.parent;
                    }
                    grabbedFoodPiece = rootFood;
                    if (grabbedFoodPiece.userData) {
                        grabbedFoodPiece.userData.velocity.set(0, 0, 0);
                        grabbedFoodPiece.userData.isGrabbedReleased = true;
                    }
                    if (cameraMode !== 'fpv') controls.enabled = false;
                }
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (activeTool === 'brush') return;

            if (activePointerId !== null && event.pointerId !== activePointerId) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (holdingFoodType && ghostFoodMesh && event.pointerType === 'mouse') {
                raycaster.setFromCamera(mouse, camera);
                cursorPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));
                if (raycaster.ray.intersectPlane(cursorPlane, cursorWorldPos)) {
                    const limit = (boxSize / 2) - 1.5;
                    const px = Math.max(-limit, Math.min(limit, cursorWorldPos.x));
                    const pz = Math.max(-limit, Math.min(limit, cursorWorldPos.z));
                    ghostFoodMesh.position.set(px, 3, pz);
                }
            }

            if (activeTool === 'grab' && grabbedObject) {
                raycaster.setFromCamera(mouse, camera);
                let currentY = 0;
                if (grabbedObject === 'spider') currentY = spiderGroup.position.y;
                else if (grabbedObject === 'ball') currentY = ball.position.y;
                else if (grabbedObject === 'food' && grabbedFoodPiece) currentY = grabbedFoodPiece.position.y;

                grabPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, currentY, 0));

                if (raycaster.ray.intersectPlane(grabPlane, intersectionPoint)) {
                    const limit = (boxSize / 2) - 1.5;
                    intersectionPoint.x = Math.max(-limit, Math.min(limit, intersectionPoint.x));
                    intersectionPoint.z = Math.max(-limit, Math.min(limit, intersectionPoint.z));

                    if (grabbedObject === 'spider') {
                        spiderGroup.position.x = intersectionPoint.x;
                        spiderGroup.position.z = intersectionPoint.z;
                        spiderGroup.position.y = Math.max(getTerrainHeight(intersectionPoint.x, intersectionPoint.z) + 3, intersectionPoint.y);
                    } else if (grabbedObject === 'ball') {
                        ball.position.x = intersectionPoint.x;
                        ball.position.z = intersectionPoint.z;
                        ball.position.y = Math.max(getTerrainHeight(intersectionPoint.x, intersectionPoint.z) + ballRadius + 3, intersectionPoint.y);
                    } else if (grabbedObject === 'food' && grabbedFoodPiece) {
                        grabbedFoodPiece.position.x = intersectionPoint.x;
                        grabbedFoodPiece.position.z = intersectionPoint.z;
                        grabbedFoodPiece.position.y = Math.max(getTerrainHeight(intersectionPoint.x, intersectionPoint.z) + (grabbedFoodPiece.userData.radius || 0.3) + 3, intersectionPoint.y);
                    }
                }
            } else if (activeTool === 'finger' && trackingCursor) {
                raycaster.setFromCamera(mouse, camera);
                cursorPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));
                if (raycaster.ray.intersectPlane(cursorPlane, cursorWorldPos)) {
                    const limit = (boxSize / 2) - 1.5;
                    targetPosition.x = Math.max(-limit, Math.min(limit, cursorWorldPos.x));
                    targetPosition.z = Math.max(-limit, Math.min(limit, cursorWorldPos.z));
                    targetPosition.y = 0;
                    spiderSpeed = 0.08;

            }

        const handlePointerUpOrCancel = (event) => {
            if (activePointerId !== null && event.pointerId !== activePointerId) return;

            if (activeTool === 'finger' && isHoldingBall) {
                isHoldingBall = false;
                if (cameraMode !== 'fpv') controls.enabled = true;

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0;
                camDir.normalize();

                const maxHoldTime = 3.0;
                const effectiveTime = Math.min(chargeTime, maxHoldTime);
                const speedMultiplier = 6 + effectiveTime * 10;

                ball.position.copy(ballOriginalPos);
                ballVelocity.copy(camDir).multiplyScalar(speedMultiplier);
                ballVelocity.y = 4 + effectiveTime * 4;
                playBounceSound(1.2);

                isChasingBall = true;
                happyTimer = 4.0;
                targetingBall = true;
                spiderSpeed = 0.08;
                isFrontLegDancing = false;
                isJumping = false;
                isShootingWeb = false;
                webState = 'idle';

                grabbedObject = null;

                pickNewTarget();
