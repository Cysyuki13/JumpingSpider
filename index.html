<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Jumping Spider Pet - Enhanced Ball Physics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #sidebar {
            position: absolute;
            top: 20px;
            right: 0;
            width: 70px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 12px 0 0 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: -4px 8px 32px rgba(0, 0, 0, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.collapsed {
            transform: translateX(calc(100% - 15px));
        }

        #sidebar.collapsed:hover {
            transform: translateX(calc(100% - 20px));
            cursor: pointer;
        }

        #left-sidebar {
            position: absolute;
            top: 20px;
            left: 0;
            width: 80px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 0 12px 12px 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 4px 8px 32px rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #left-sidebar.collapsed {
            transform: translateX(calc(-100% + 15px));
        }

        #left-sidebar.collapsed:hover {
            transform: translateX(calc(-100% + 20px));
            cursor: pointer;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .btn-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .tool-btn {
            width: 50px;
            height: 45px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .tool-btn.active {
            background: #ff3366;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
        }

        #btn-toggle {
            height: 25px;
            font-size: 16px;
        }

        #btn-left-toggle {
            height: 25px;
            font-size: 16px;
            width: 50px;
            align-self: center;
        }

        /* Exit Camera Overlay Button */
        #btn-exit-cam {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(255, 51, 102, 0.85);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        #btn-exit-cam:hover {
            background: rgba(255, 51, 102, 1);
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>

<body>
    <button id="btn-exit-cam">Exit Camera Mode</button>

    <div id="left-sidebar">
        <button id="btn-left-toggle" class="tool-btn" title="Toggle Info Menu">◀</button>
        <div class="menu-item">
            <button id="btn-dance" class="tool-btn" title="Force Dance">💃</button>
            <span class="btn-label">Dance</span>
        </div>
        <div class="menu-item">
            <button id="btn-play-ball" class="tool-btn" title="Play Ball Once">⚽</button>
            <span class="btn-label">Play Ball</span>
        </div>
        <div class="menu-item">
            <button id="btn-follow-cam" class="tool-btn" title="Follow Cam">🎥</button>
            <span class="btn-label">Follow</span>
        </div>
        <div class="menu-item">
            <button id="btn-fpv-cam" class="tool-btn" title="First Person Cam">🕷️</button>
            <span class="btn-label">Spider View</span>
        </div>
    </div>

    <div id="sidebar">
        <button id="btn-toggle" class="tool-btn" title="Collapse Menu">▶</button>
        <button id="btn-finger" class="tool-btn" title="Finger Tool">👆</button>
        <button id="btn-grab" class="tool-btn" title="Grab Tool">✊</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ===== 0. Web Audio API Setup for Sound Effects =====
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSpiderKickSound() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playBounceSound(intensity = 1.0) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            const baseFreq = 120 * Math.min(Math.max(intensity, 0.2), 2.0);
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.2 * Math.min(intensity, 1.0), audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playClickSound() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // ===== 1. Scene Setup =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#222222');

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ===== 2. Lighting =====
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 25, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        const d = 20;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        scene.add(dirLight);

        // ===== 3. Glass Terrarium =====
        const boxSize = 20;
        const glassGeometry = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const glassMaterial = new THREE.MeshStandardMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.15,
            roughness: 0.1,
            metalness: 0.1,
            side: THREE.BackSide,
            depthWrite: false
        });
        const glassCube = new THREE.Mesh(glassGeometry, glassMaterial);
        glassCube.position.y = boxSize / 2;
        scene.add(glassCube);

        const edges = new THREE.EdgesGeometry(glassGeometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.3, transparent: true });
        const boxEdges = new THREE.LineSegments(edges, lineMaterial);
        boxEdges.position.y = boxSize / 2;
        scene.add(boxEdges);

        function getTerrainHeight(x, z) {
            const edgeDistanceX = (boxSize / 2) - Math.abs(x);
            const edgeDistanceZ = (boxSize / 2) - Math.abs(z);
            const edgeFactor = Math.min(1.0, Math.max(0, Math.min(edgeDistanceX, edgeDistanceZ) / 2.0));

            return (Math.sin(x * 0.35) * Math.cos(z * 0.35) * 0.6 +
                Math.sin(x * 0.8) * Math.sin(z * 0.7) * 0.25 +
                Math.cos(x * 1.5 + z * 1.5) * 0.1) * edgeFactor;
        }

        function getTerrainNormal(x, z) {
            const eps = 0.1;
            const hL = getTerrainHeight(x - eps, z);
            const hR = getTerrainHeight(x + eps, z);
            const hD = getTerrainHeight(x, z - eps);
            const hU = getTerrainHeight(x, z + eps);

            const normal = new THREE.Vector3(hL - hR, 2.0 * eps, hD - hU);
            normal.normalize();
            return normal;
        }

        function createSoilTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#2c1e12';
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 40000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const radius = Math.random() * 1.5;

                const shade = Math.random();
                if (shade < 0.6) {
                    ctx.fillStyle = 'rgba(40, 25, 12, 0.4)';
                } else if (shade < 0.9) {
                    ctx.fillStyle = 'rgba(75, 52, 32, 0.4)';
                } else {
                    ctx.fillStyle = 'rgba(105, 82, 55, 0.25)';
                }

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);
            return texture;
        }

        const floorGeo = new THREE.PlaneGeometry(boxSize, boxSize, 48, 48);
        const posAttribute = floorGeo.attributes.position;

        for (let i = 0; i < posAttribute.count; i++) {
            const vx = posAttribute.getX(i);
            const vy = posAttribute.getY(i);
            posAttribute.setZ(i, getTerrainHeight(vx, vy));
        }
        floorGeo.computeVertexNormals();

        const floorMat = new THREE.MeshStandardMaterial({
            map: createSoilTexture(),
            roughness: 0.9,
            metalness: 0.05
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0.02;
        floor.receiveShadow = true;
        scene.add(floor);

        const waterLevel = -0.25;
        const waterGeo = new THREE.PlaneGeometry(boxSize - 1, boxSize - 1);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x3399ff,
            transparent: true,
            opacity: 0.6,
            roughness: 0.1,
            metalness: 0.8
        });
        const waterLayer = new THREE.Mesh(waterGeo, waterMat);
        waterLayer.rotation.x = -Math.PI / 2;
        waterLayer.position.y = waterLevel + 0.04;
        scene.add(waterLayer);

        const activeRipples = [];
        const rippleGeo = new THREE.RingGeometry(0.05, 0.12, 16);
        const rippleMatTemplate = new THREE.MeshBasicMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide
        });

        function triggerSplash(pos) {
            if (getTerrainHeight(pos.x, pos.z) < waterLevel) {
                const rippleMesh = new THREE.Mesh(rippleGeo, rippleMatTemplate.clone());
                rippleMesh.rotation.x = -Math.PI / 2;
                rippleMesh.position.set(pos.x, waterLevel + 0.06, pos.z);
                scene.add(rippleMesh);
                activeRipples.push({ mesh: rippleMesh, life: 1.0 });
            }
        }

        // ===== 4. Toy Ball & Enhanced Physics Parameters =====
        const ballRadius = 1;
        const ballGeo = new THREE.SphereGeometry(ballRadius, 16, 16);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.4 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(5, ballRadius + 2, -5);
        ball.castShadow = true;
        scene.add(ball);

        const ballVelocity = new THREE.Vector3(0, 0, 0);
        const gravity = 22;
        const airDrag = 0.992;
        const bounceFactor = 0.45;
        const surfaceFriction = 0.94;

        let isHoldingBall = false;
        let chargeTime = 0;
        const ballOriginalPos = new THREE.Vector3();
        let ballWasInWater = false;

        // ===== 5. SPIDER MODEL =====
        const spiderGroup = new THREE.Group();
        const spiderBodyContainer = new THREE.Group();
        spiderGroup.add(spiderBodyContainer);

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.7, metalness: 0.1 });
        const darkBodyMat = new THREE.MeshStandardMaterial({ color: 0x5C4033, roughness: 0.8 });
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.1, metalness: 0.3 });
        const eyeHighlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05, metalness: 0.1 });
        const legMat = new THREE.MeshStandardMaterial({ color: 0x7A6B52, roughness: 0.8 });
        const cheliceraeMat = new THREE.MeshStandardMaterial({ color: 0x3A2817, roughness: 0.6 });

        const cephalothorax = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.0, 1.2), bodyMat);
        cephalothorax.position.set(0, 1.0, 0.5);
        cephalothorax.castShadow = true;
        spiderBodyContainer.add(cephalothorax);

        const cephTop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 1.0), darkBodyMat);
        cephTop.position.set(0, 1.5, 0.5);
        spiderBodyContainer.add(cephTop);

        const abdomen = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 1.6), bodyMat);
        abdomen.position.set(0, 1.2, -1.2);
        abdomen.castShadow = true;
        spiderBodyContainer.add(abdomen);

        const abdomenTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 1.3), bodyMat);
        abdomenTop.position.set(0, 1.8, -1.2);
        spiderBodyContainer.add(abdomenTop);

        const abPattern1 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xD97C5E, roughness: 0.5 }));
        abPattern1.position.set(0, 1.7, -1.3);
        spiderBodyContainer.add(abPattern1);

        const abPattern2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 0.9), new THREE.MeshStandardMaterial({ color: 0x378B80, roughness: 0.5 }));
        abPattern2.position.set(0, 1.75, -1.0);
        spiderBodyContainer.add(abPattern2);

        const leftAME = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), eyeMat);
        leftAME.position.set(-0.32, 1.15, 1.32);
        leftAME.scale.set(1, 1.1, 0.8);
        spiderBodyContainer.add(leftAME);

        const rightAME = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), eyeMat);
        rightAME.position.set(0.32, 1.15, 1.32);
        rightAME.scale.set(1, 1.1, 0.8);
        spiderBodyContainer.add(rightAME);

        const lHighlight = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), eyeHighlightMat);
        lHighlight.position.set(-0.24, 1.22, 1.46);
        spiderBodyContainer.add(lHighlight);

        const rHighlight = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), eyeHighlightMat);
        rHighlight.position.set(0.38, 1.22, 1.46);
        spiderBodyContainer.add(rHighlight);

        const leftALE = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
        leftALE.position.set(-0.58, 1.05, 0.95);
        spiderBodyContainer.add(leftALE);

        const rightALE = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
        rightALE.position.set(0.58, 1.05, 0.95);
        spiderBodyContainer.add(rightALE);

        const leftPME = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
        leftPME.position.set(-0.4, 1.45, 0.9);
        spiderBodyContainer.add(leftPME);

        const rightPME = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
        rightPME.position.set(0.4, 1.45, 0.9);
        spiderBodyContainer.add(rightPME);

        const leftChelicera = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.45, 0.2), cheliceraeMat);
        leftChelicera.position.set(-0.35, 0.55, 1.2);
        spiderBodyContainer.add(leftChelicera);

        const rightChelicera = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.45, 0.2), cheliceraeMat);
        rightChelicera.position.set(0.35, 0.55, 1.2);
        spiderBodyContainer.add(rightChelicera);

        const pedipalpMat = new THREE.MeshStandardMaterial({ color: 0x6B5B42, roughness: 0.8 });
        const leftPedipalp = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.25, 0.1), pedipalpMat);
        leftPedipalp.position.set(-0.52, 0.65, 1.05);
        spiderBodyContainer.add(leftPedipalp);

        const rightPedipalp = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.25, 0.1), pedipalpMat);
        rightPedipalp.position.set(0.52, 0.65, 1.05);
        spiderBodyContainer.add(rightPedipalp);

        const crestMat1 = new THREE.MeshStandardMaterial({ color: 0x378B80, roughness: 0.5 });
        const crestMat2 = new THREE.MeshStandardMaterial({ color: 0xD97C5E, roughness: 0.5 });
        const crestMat3 = new THREE.MeshStandardMaterial({ color: 0x2E3B4E, roughness: 0.5 });

        const crestBase = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.35, 1.0), crestMat2);
        crestBase.position.set(0, 1.85, 0.1);
        spiderBodyContainer.add(crestBase);

        const crestMain = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.18, 0.8), crestMat1);
        crestMain.position.set(0, 2.05, 0.1);
        spiderBodyContainer.add(crestMain);

        const crestCenter = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.22, 0.8), crestMat3);
        crestCenter.position.set(0, 2.08, 0.1);
        spiderBodyContainer.add(crestCenter);

        const crestWingL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.6), crestMat1);
        crestWingL.position.set(-0.9, 1.9, 0.1);
        spiderBodyContainer.add(crestWingL);

        const crestWingR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.6), crestMat1);
        crestWingR.position.set(0.9, 1.9, 0.1);
        spiderBodyContainer.add(crestWingR);

        const crestFront = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.5), crestMat2);
        crestFront.position.set(0, 1.9, 0.6);
        spiderBodyContainer.add(crestFront);

        // --- Leg Thickness Configuration ---
        const legThickness = 0.32;

        // --- Hierarchical Jointed Legs ---
        const spiderLegs = [];

        function createLeg(xSide, zPos, yawAngle, legIndex) {
            const legRoot = new THREE.Group();
            legRoot.position.set(xSide * 0.7, 0.78, zPos);
            legRoot.rotation.y = yawAngle;

            const coxa = new THREE.Group();
            legRoot.add(coxa);

            const femurPivot = new THREE.Group();
            femurPivot.rotation.x = 0.55;
            femurPivot.rotation.z = xSide * 0.2;
            coxa.add(femurPivot);

            const femur = new THREE.Mesh(new THREE.BoxGeometry(legThickness, legThickness, 1.4), legMat);
            femur.position.z = 0.7;
            femur.castShadow = true;
            femurPivot.add(femur);

            const tibiaPivot = new THREE.Group();
            tibiaPivot.position.z = 1.4;
            tibiaPivot.rotation.x = 0.65;
            femurPivot.add(tibiaPivot);

            const tibia = new THREE.Mesh(new THREE.BoxGeometry(legThickness * 0.85, legThickness * 0.85, 1.0), legMat);
            tibia.position.z = 0.5;
            tibia.castShadow = true;
            tibiaPivot.add(tibia);

            const tarsusPivot = new THREE.Group();
            tarsusPivot.position.z = 1.0;
            tarsusPivot.rotation.x = -0.25;
            tibiaPivot.add(tarsusPivot);

            const tarsus = new THREE.Mesh(new THREE.BoxGeometry(legThickness * 0.6, legThickness * 0.6, 0.4), legMat);
            tarsus.position.z = 0.2;
            tarsus.castShadow = true;
            tarsusPivot.add(tarsus);

            spiderLegs.push({
                root: legRoot,
                coxa: coxa,
                femurPivot: femurPivot,
                tibiaPivot: tibiaPivot,
                tarsusPivot: tarsusPivot,
                baseYaw: yawAngle,
                baseFemurX: 0.55,
                baseTibiaX: 0.65,
                index: legIndex,
                xSide: xSide,
                localRestZ: zPos,
                wasInWater: false
            });

            return legRoot;
        }

        spiderGroup.add(createLeg(1, 0.8, 0.6, 0));
        spiderGroup.add(createLeg(-1, 0.8, -0.6, 1));
        spiderGroup.add(createLeg(1, 0.3, 0.9, 2));
        spiderGroup.add(createLeg(-1, 0.3, -0.9, 3));
        spiderGroup.add(createLeg(1, -0.3, 1.3, 4));
        spiderGroup.add(createLeg(-1, -0.3, -1.3, 5));
        spiderGroup.add(createLeg(1, -0.9, 1.8, 6));
        spiderGroup.add(createLeg(-1, -0.9, -1.8, 7));

        scene.add(spiderGroup);

        // ===== 6. Camera Controls =====
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, boxSize / 2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 60;
        controls.minDistance = 10;
        
        // Mobile-friendly orbit configuration: require two fingers to rotate the camera, 
        // leaving single touches free for UI interaction and tools.
        controls.touches = {
            ONE: THREE.MOUSE.NONE,
            TWO: THREE.TOUCH.DOLLY_ROTATE
        };

        // ===== Camera Mode State Variables =====
        let cameraMode = 'normal';
        const btnFollowCam = document.getElementById('btn-follow-cam');
        const btnFpvCam = document.getElementById('btn-fpv-cam');
        const btnExitCam = document.getElementById('btn-exit-cam');

        function resetCameraModes() {
            if (cameraMode === 'fpv') {
                camera.position.set(25, 15, 35);
                camera.rotation.set(0, 0, 0);
                controls.target.set(0, boxSize / 2, 0);
            }
            cameraMode = 'normal';
            btnFollowCam.classList.remove('active');
            btnFpvCam.classList.remove('active');
            btnExitCam.style.display = 'none';
            controls.enabled = true;
        }

        btnFollowCam.addEventListener('click', () => {
            playClickSound();
            if (cameraMode === 'follow') {
                resetCameraModes();
            } else {
                resetCameraModes();
                cameraMode = 'follow';
                btnFollowCam.classList.add('active');
                btnExitCam.style.display = 'block';
                controls.enabled = true;
            }
        });

        btnFpvCam.addEventListener('click', () => {
            playClickSound();
            if (cameraMode === 'fpv') {
                resetCameraModes();
            } else {
                resetCameraModes();
                cameraMode = 'fpv';
                btnFpvCam.classList.add('active');
                btnExitCam.style.display = 'block';

                controls.enabled = false;
                spiderGroup.updateMatrixWorld(true);

                const eyeLocal = new THREE.Vector3(0, 1.3, 6.0);
                const eyeWorld = eyeLocal.clone().applyMatrix4(spiderGroup.matrixWorld);
                camera.position.copy(eyeWorld);

                const lookAtLocal = new THREE.Vector3(0, 1.3, 11.5);
                const lookAtWorld = lookAtLocal.clone().applyMatrix4(spiderGroup.matrixWorld);
                camera.lookAt(lookAtWorld);
                controls.target.copy(lookAtWorld);
            }
        });

        btnExitCam.addEventListener('click', () => {
            playClickSound();
            resetCameraModes();
        });

        // ===== 7. UI & Tool Selection System =====
        let targetPosition = new THREE.Vector3();
        let isJumping = false;
        let jumpProgress = 0;
        let startJumpPos = new THREE.Vector3();
        let spiderSpeed = 0.05;
        let targetingBall = false;
        let playBallRequested = false;

        let trackingCursor = false;
        const cursorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const cursorWorldPos = new THREE.Vector3();

        let activeTool = null;
        let grabbedObject = null;
        let grabPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let intersectionPoint = new THREE.Vector3();

        const sidebar = document.getElementById('sidebar');
        const btnFinger = document.getElementById('btn-finger');
        const btnGrab = document.getElementById('btn-grab');
        const btnToggle = document.getElementById('btn-toggle');

        const leftSidebar = document.getElementById('left-sidebar');
        const btnLeftToggle = document.getElementById('btn-left-toggle');
        const btnDance = document.getElementById('btn-dance');
        const btnPlayBall = document.getElementById('btn-play-ball');

        btnToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            playClickSound();
            sidebar.classList.toggle('collapsed');
            btnToggle.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        });

        sidebar.addEventListener('click', (e) => {
            if (sidebar.classList.contains('collapsed')) {
                playClickSound();
                sidebar.classList.remove('collapsed');
                btnToggle.textContent = '◀';
            }
        });

        btnLeftToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            playClickSound();
            leftSidebar.classList.toggle('collapsed');
            btnLeftToggle.textContent = leftSidebar.classList.contains('collapsed') ? '◀' : '▶';
        });

        leftSidebar.addEventListener('click', (e) => {
            if (leftSidebar.classList.contains('collapsed')) {
                playClickSound();
                leftSidebar.classList.remove('collapsed');
                btnLeftToggle.textContent = '◀';
            }
        });

        window.addEventListener('pointerdown', (event) => {
            if (!sidebar.classList.contains('collapsed') && !sidebar.contains(event.target)) {
                playClickSound();
                sidebar.classList.add('collapsed');
                btnToggle.textContent = '▶';
            }
            if (!leftSidebar.classList.contains('collapsed') && !leftSidebar.contains(event.target)) {
                playClickSound();
                leftSidebar.classList.add('collapsed');
                btnLeftToggle.textContent = '▶';
            }
        });

        let isFrontLegDancing = false;
        let danceTimer = 0;

        btnDance.addEventListener('click', () => {
            playClickSound();

            isJumping = false;
            trackingCursor = false;
            targetingBall = false;
            playBallRequested = false;
            targetPosition.copy(spiderGroup.position);

            isFrontLegDancing = true;
            danceTimer = 0;
            btnDance.classList.add('active');
            setTimeout(() => {
                btnDance.classList.remove('active');
            }, 1000);
        });

        btnPlayBall.addEventListener('click', () => {
            playClickSound();

            isJumping = false;
            trackingCursor = false;
            isFrontLegDancing = false;
            targetingBall = true;
            playBallRequested = true;

            spiderSpeed = 0.04 + Math.random() * 0.07;

            btnPlayBall.classList.add('active');
            setTimeout(() => {
                btnPlayBall.classList.remove('active');
            }, 1000);
        });

        btnFinger.addEventListener('click', () => {
            playClickSound();
            if (activeTool === 'finger') {
                activeTool = null;
                trackingCursor = false;
                btnFinger.classList.remove('active');
            } else {
                activeTool = 'finger';
                btnFinger.classList.add('active');
                btnGrab.classList.remove('active');
            }
            if (grabbedObject) { grabbedObject = null; if (cameraMode !== 'fpv') controls.enabled = true; }
        });

        btnGrab.addEventListener('click', () => {
            playClickSound();
            if (activeTool === 'grab') {
                activeTool = null;
                btnGrab.classList.remove('active');
            } else {
                activeTool = 'grab';
                btnGrab.classList.add('active');
                btnFinger.classList.remove('active');
            }
            if (isHoldingBall) { isHoldingBall = false; if (cameraMode !== 'fpv') controls.enabled = true; }
            trackingCursor = false;
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            if (event.button !== 0 && event.pointerType === 'mouse') return;
            if (event.clientX < 90 && event.clientY < 280) return;
            if (event.clientX > window.innerWidth - 90 && event.clientY < 220) return;
            if (!activeTool) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const spiderMeshes = [];
            spiderGroup.traverse(child => { if (child.isMesh) spiderMeshes.push(child); });

            const spiderIntersect = raycaster.intersectObjects(spiderMeshes);
            const ballIntersect = raycaster.intersectObject(ball);

            if (activeTool === 'finger') {
                if (spiderIntersect.length > 0) {
                    playClickSound();
                    playSpiderKickSound();

                    startJumpPos.copy(spiderGroup.position);
                    jumpProgress = 0;
                    isJumping = true;
                    trackingCursor = false;
                    targetingBall = false;
                    playBallRequested = false;
                    isFrontLegDancing = false;

                    const limit = (boxSize / 2) - 2;
                    const randomAngle = Math.random() * Math.PI * 2;
                    const jumpDist = 5 + Math.random() * 4;

                    targetPosition.set(
                        Math.max(-limit, Math.min(limit, spiderGroup.position.x + Math.cos(randomAngle) * jumpDist)),
                        0,
                        Math.max(-limit, Math.min(limit, spiderGroup.position.z + Math.sin(randomAngle) * jumpDist))
                    );
                } else if (ballIntersect.length > 0) {
                    playClickSound();
                    isHoldingBall = true;
                    chargeTime = 0;
                    ballOriginalPos.copy(ball.position);
                    ballVelocity.set(0, 0, 0);
                    if (cameraMode !== 'fpv') controls.enabled = false;
                    trackingCursor = false;
                } else {
                    playClickSound();
                    trackingCursor = true;
                    targetingBall = false;
                    playBallRequested = false;
                    isJumping = false;
                    isFrontLegDancing = false;
                }
            } else if (activeTool === 'grab') {
                if (spiderIntersect.length > 0) {
                    grabbedObject = 'spider';
                    isJumping = false;
                    isFrontLegDancing = false;
                    if (cameraMode !== 'fpv') controls.enabled = false;
                } else if (ballIntersect.length > 0) {
                    grabbedObject = 'ball';
                    ballVelocity.set(0, 0, 0);
                    if (cameraMode !== 'fpv') controls.enabled = false;
                }
            }
        });

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (activeTool === 'grab' && grabbedObject) {
                raycaster.setFromCamera(mouse, camera);

                const currentY = grabbedObject === 'spider' ? spiderGroup.position.y : ball.position.y;
                grabPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, currentY, 0));

                if (raycaster.ray.intersectPlane(grabPlane, intersectionPoint)) {
                    const limit = (boxSize / 2) - 1.5;
                    intersectionPoint.x = Math.max(-limit, Math.min(limit, intersectionPoint.x));
                    intersectionPoint.z = Math.max(-limit, Math.min(limit, intersectionPoint.z));

                    if (grabbedObject === 'spider') {
                        spiderGroup.position.x = intersectionPoint.x;
                        spiderGroup.position.z = intersectionPoint.z;
                        spiderGroup.position.y = Math.max(getTerrainHeight(intersectionPoint.x, intersectionPoint.z) + 3, intersectionPoint.y);
                    } else if (grabbedObject === 'ball') {
                        ball.position.x = intersectionPoint.x;
                        ball.position.z = intersectionPoint.z;
                        ball.position.y = Math.max(getTerrainHeight(intersectionPoint.x, intersectionPoint.z) + ballRadius + 3, intersectionPoint.y);
                    }
                }
            } else if (activeTool === 'finger' && trackingCursor) {
                raycaster.setFromCamera(mouse, camera);
                cursorPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));
                if (raycaster.ray.intersectPlane(cursorPlane, cursorWorldPos)) {
                    const limit = (boxSize / 2) - 1.5;
                    targetPosition.x = Math.max(-limit, Math.min(limit, cursorWorldPos.x));
                    targetPosition.z = Math.max(-limit, Math.min(limit, cursorWorldPos.z));
                    targetPosition.y = 0;
                    spiderSpeed = 0.08;
                }
            }
        });

        window.addEventListener('pointerup', () => {
            if (activeTool === 'finger' && isHoldingBall) {
                isHoldingBall = false;
                if (cameraMode !== 'fpv') controls.enabled = true;

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0;
                camDir.normalize();

                const maxHoldTime = 3.0;
                const effectiveTime = Math.min(chargeTime, maxHoldTime);
                const speedMultiplier = 8 + effectiveTime * 15;

                ball.position.copy(ballOriginalPos);
                ballVelocity.copy(camDir).multiplyScalar(speedMultiplier);
                ballVelocity.y = 6 + effectiveTime * 6;
                playBounceSound(1.5);
            } else if (activeTool === 'grab' && grabbedObject) {
                grabbedObject = null;
                if (cameraMode !== 'fpv') controls.enabled = true;
                pickNewTarget();
            }
        });

        function pickNewTarget() {
            if (activeTool === 'finger' && trackingCursor) return;
            if (isFrontLegDancing) return;

            const limit = (boxSize / 2) - 2;
            spiderSpeed = 0.02 + Math.random() * 0.06;

            if (Math.random() < 0.3) {
                targetingBall = true;
                spiderSpeed = 0.06 + Math.random() * 0.04;
            } else {
                targetingBall = false;
                targetPosition.set(
                    (Math.random() - 0.5) * limit * 2,
                    0,
                    (Math.random() - 0.5) * limit * 2
                );
            }
            isJumping = Math.random() < 0.4;
            startJumpPos.copy(spiderGroup.position);
            jumpProgress = 0;
        }

        pickNewTarget();

        // ===== 8. Animation Loop =====
        const clock = new THREE.Clock();
        let walkCycle = 0;
        let idleTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            for (let i = activeRipples.length - 1; i >= 0; i--) {
                const r = activeRipples[i];
                r.life -= delta * 1.5;
                r.mesh.scale.addScalar(delta * 3.0);
                r.mesh.material.opacity = r.life * 0.8;

                if (r.life <= 0) {
                    scene.remove(r.mesh);
                    r.mesh.geometry.dispose();
                    r.mesh.material.dispose();
                    activeRipples.splice(i, 1);
                }
            }

            if (isHoldingBall) {
                chargeTime += delta;
                const shakeIntensity = Math.min(0.3, 0.05 + chargeTime * 0.05);
                ball.position.copy(ballOriginalPos).add(new THREE.Vector3(
                    (Math.random() - 0.5) * shakeIntensity,
                    (Math.random() - 0.5) * shakeIntensity,
                    (Math.random() - 0.5) * shakeIntensity
                ));
            } else if (grabbedObject === 'ball') {
                // Held by grab tool
            } else {
                const subSteps = 12;
                const subDelta = delta / subSteps;

                for (let step = 0; step < subSteps; step++) {
                    ballVelocity.y -= gravity * subDelta;
                    ballVelocity.x *= Math.pow(airDrag, subDelta / 0.016);
                    ballVelocity.z *= Math.pow(airDrag, subDelta / 0.016);

                    ball.position.addScaledVector(ballVelocity, subDelta);

                    const groundH = getTerrainHeight(ball.position.x, ball.position.z);
                    const ceilingLimit = boxSize - ballRadius;
                    const boxLimit = (boxSize / 2) - ballRadius;

                    const isBallInWater = groundH < waterLevel && ball.position.y <= waterLevel + ballRadius;
                    if (isBallInWater && !ballWasInWater && Math.abs(ballVelocity.y) > 2 && step === 0) {
                        triggerSplash(ball.position);
                    }
                    ballWasInWater = isBallInWater;

                    if (ball.position.y - ballRadius < groundH + 1.5) {
                        const terrainPoint = new THREE.Vector3(ball.position.x, groundH, ball.position.z);
                        const terrainNormal = getTerrainNormal(ball.position.x, ball.position.z);
                        const toBall = new THREE.Vector3().subVectors(ball.position, terrainPoint);
                        const distAlongNormal = toBall.dot(terrainNormal);

                        if (distAlongNormal < ballRadius) {
                            const penetration = ballRadius - distAlongNormal;
                            ball.position.addScaledVector(terrainNormal, penetration);

                            const dot = ballVelocity.dot(terrainNormal);
                            if (dot < 0) {
                                const impactSpeed = Math.abs(dot);
                                if (impactSpeed > 0.8 && step === 0) {
                                    playBounceSound(Math.min(impactSpeed / 10, 1.0));
                                }
                                ballVelocity.addScaledVector(terrainNormal, -dot * (1.0 + bounceFactor));
                            }

                            const frictionFactor = Math.pow(surfaceFriction, subDelta / 0.016);
                            ballVelocity.x *= frictionFactor;
                            ballVelocity.z *= frictionFactor;

                            if (ballVelocity.length() < 0.08 && Math.abs(ballVelocity.y) < 0.1) {
                                ballVelocity.set(0, 0, 0);
                            }
                        }
                    }

                    if (ball.position.y >= ceilingLimit) {
                        ball.position.y = ceilingLimit;
                        ballVelocity.y *= -bounceFactor;
                        if (step === 0) playBounceSound(0.5);
                    }

                    if (ball.position.x > boxLimit) {
                        ball.position.x = boxLimit;
                        ballVelocity.x *= -bounceFactor;
                        if (step === 0) playBounceSound(0.4);
                    } else if (ball.position.x < -boxLimit) {
                        ball.position.x = -boxLimit;
                        ballVelocity.x *= -bounceFactor;
                        if (step === 0) playBounceSound(0.4);
                    }
                    if (ball.position.z > boxLimit) {
                        ball.position.z = boxLimit;
                        ballVelocity.z *= -bounceFactor;
                        if (step === 0) playBounceSound(0.4);
                    } else if (ball.position.z < -boxLimit) {
                        ball.position.z = -boxLimit;
                        ballVelocity.z *= -bounceFactor;
                        if (step === 0) playBounceSound(0.4);
                    }
                }

                const horizontalSpeed = Math.sqrt(ballVelocity.x * ballVelocity.x + ballVelocity.z * ballVelocity.z);
                if (horizontalSpeed > 0.05) {
                    const rotAxis = new THREE.Vector3(-ballVelocity.z, 0, ballVelocity.x).normalize();
                    const angularDist = (horizontalSpeed * delta) / ballRadius;
                    ball.rotateOnWorldAxis(rotAxis, angularDist);
                }
            }

            if (targetingBall && !isHoldingBall && grabbedObject !== 'ball' && !isFrontLegDancing) {
                targetPosition.set(ball.position.x, 0, ball.position.z);
            }

            const toTarget = new THREE.Vector3().subVectors(targetPosition, spiderGroup.position);
            toTarget.y = 0;
            const distanceToTarget = toTarget.length();
            const isMoving = distanceToTarget >= 1.0 && !isFrontLegDancing;

            if (!isMoving && !isJumping && !isFrontLegDancing && !(activeTool === 'finger' && trackingCursor)) {
                if (Math.random() < 0.02) pickNewTarget();
            }

            if (grabbedObject === 'spider') {
                spiderLegs.forEach((leg) => {
                    leg.femurPivot.rotation.x = leg.baseFemurX + 0.3;
                    leg.tibiaPivot.rotation.x = leg.baseTibiaX + 0.4;
                });
            } else if (isJumping) {
                jumpProgress += delta * 1.5;
                if (jumpProgress > 1) jumpProgress = 1;

                const jumpDir = new THREE.Vector3().subVectors(targetPosition, startJumpPos);
                jumpDir.y = 0;
                if (jumpDir.lengthSq() > 0.001) {
                    const targetRot = Math.atan2(jumpDir.x, jumpDir.z);
                    spiderGroup.rotation.y = THREE.MathUtils.lerp(spiderGroup.rotation.y, targetRot, 0.2);
                }

                spiderGroup.position.lerpVectors(startJumpPos, targetPosition, jumpProgress);

                const targetGroundY = getTerrainHeight(spiderGroup.position.x, spiderGroup.position.z);
                const jumpHeight = 4;
                spiderGroup.position.y = targetGroundY + Math.sin(jumpProgress * Math.PI) * jumpHeight;

                spiderLegs.forEach((leg) => {
                    leg.femurPivot.rotation.x = THREE.MathUtils.lerp(
                        leg.femurPivot.rotation.x,
                        leg.baseFemurX - 0.5,
                        0.1
                    );
                    leg.tibiaPivot.rotation.x = THREE.MathUtils.lerp(
                        leg.tibiaPivot.rotation.x,
                        leg.baseTibiaX + 0.6,
                        0.1
                    );
                });

                if (jumpProgress === 1) {
                    isJumping = false;
                    if (getTerrainHeight(spiderGroup.position.x, spiderGroup.position.z) < waterLevel) {
                        triggerSplash(spiderGroup.position);
                    }
                }
            } else {
                if (isMoving) {
                    idleTime = 0;
                    const targetRotation = Math.atan2(toTarget.x, toTarget.z);
                    let currentRotation = spiderGroup.rotation.y;

                    let diff = targetRotation - currentRotation;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;

                    spiderGroup.rotation.y += diff * Math.min(1.0, delta * 4.0);

                    const forwardDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), spiderGroup.rotation.y);
                    spiderGroup.position.addScaledVector(forwardDir, spiderSpeed);

                    walkCycle += delta * (spiderSpeed * 200);
                } else {
                    walkCycle = 0;
                    if (!isFrontLegDancing) {
                        idleTime += delta;
                        if (idleTime > 2.0 && Math.random() < 0.005) {
                            isFrontLegDancing = true;
                            danceTimer = 0;
                        }
                    }

                    if (isFrontLegDancing) {
                        danceTimer += delta;
                        if (danceTimer > 4.0) {
                            isFrontLegDancing = false;
                            idleTime = 0;
                        }
                    }
                }

                const currentGroundY = getTerrainHeight(spiderGroup.position.x, spiderGroup.position.z);
                const walkBob = isMoving ? Math.abs(Math.sin(walkCycle * 1.5)) * 0.15 : 0;
                spiderGroup.position.y = THREE.MathUtils.lerp(spiderGroup.position.y, currentGroundY + walkBob, 0.2);

                if (!isMoving && !isFrontLegDancing) {
                    const breath = Math.sin(idleTime * 2.5) * 0.04;
                    const lookAround = Math.sin(idleTime * 1.0) * 0.05;

                    spiderBodyContainer.position.y = breath;
                    spiderBodyContainer.rotation.x = breath * 0.5;
                    spiderBodyContainer.rotation.y = lookAround;

                    leftPedipalp.rotation.z = Math.sin(idleTime * 6) * 0.05;
                    rightPedipalp.rotation.z = -Math.sin(idleTime * 6) * 0.05;
                } else {
                    spiderBodyContainer.position.y = THREE.MathUtils.lerp(spiderBodyContainer.position.y, 0, 0.2);
                    spiderBodyContainer.rotation.x = THREE.MathUtils.lerp(spiderBodyContainer.rotation.x, 0, 0.2);
                    spiderBodyContainer.rotation.y = THREE.MathUtils.lerp(spiderBodyContainer.rotation.y, 0, 0.2);
                }

                spiderLegs.forEach((leg) => {
                    const isFrontLeg = (leg.index === 0 || leg.index === 1);

                    if (isFrontLegDancing && isFrontLeg) {
                        const sideMultiplier = (leg.index === 0) ? 1 : -1;
                        const dancePhase = danceTimer * 8;

                        leg.femurPivot.rotation.x = -1.0 + Math.sin(dancePhase) * 0.2;
                        leg.tibiaPivot.rotation.x = 0.2 + Math.cos(dancePhase * 1.3) * 0.2;
                        leg.root.rotation.y = leg.baseYaw + (0.4 * sideMultiplier) + Math.sin(dancePhase * 0.7) * 0.2;
                    } else {
                        const uniqueOffset = leg.index * 0.785;
                        const cycle = (isMoving ? walkCycle : 0) + uniqueOffset;

                        const rawCycleVal = Math.sin(cycle);
                        const stepUp = Math.max(0, rawCycleVal);
                        const stepForward = Math.cos(cycle) * 0.3;

                        const footWorldPos = new THREE.Vector3(leg.xSide * 1.4, 0, leg.localRestZ + stepForward);
                        footWorldPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), spiderGroup.rotation.y);
                        footWorldPos.add(spiderGroup.position);

                        const exactFloorY = getTerrainHeight(footWorldPos.x, footWorldPos.z) + 0.02;

                        const isFootInWater = exactFloorY < waterLevel;
                        if (isFootInWater && !leg.wasInWater && stepUp < 0.1) {
                            triggerSplash(footWorldPos);
                        }
                        leg.wasInWater = isFootInWater;

                        const groundLocalY = exactFloorY - spiderGroup.position.y - 0.78;
                        const idleBreathOffset = !isMoving ? Math.sin(idleTime * 2.5 + leg.index) * 0.03 : 0;

                        const targetY = (groundLocalY / Math.cos(leg.femurPivot.rotation.z)) + stepUp * 0.45;
                        const targetZ = 1.6 + stepForward;

                        const L1 = 1.4;
                        const L2 = 1.4;
                        const D = Math.sqrt(targetY * targetY + targetZ * targetZ);
                        const D_clamped = Math.min(D, L1 + L2 - 0.001);

                        const alpha = Math.acos((L1 * L1 + D_clamped * D_clamped - L2 * L2) / (2 * L1 * D_clamped));
                        const beta = Math.acos((L1 * L1 + L2 * L2 - D_clamped * D_clamped) / (2 * L1 * L2));

                        const theta_down = Math.atan2(-targetY, targetZ);

                        leg.femurPivot.rotation.x = theta_down - alpha + idleBreathOffset;
                        leg.tibiaPivot.rotation.x = Math.PI - beta - idleBreathOffset;

                        leg.root.rotation.y = leg.baseYaw + (stepForward * 0.1);
                    }
                });
            }

            if (!isHoldingBall && grabbedObject !== 'spider' && grabbedObject !== 'ball') {
                const spiderCenter = spiderGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));
                const spiderRadius = 1.3;
                const minDistance = spiderRadius + ballRadius;

                const toBall = new THREE.Vector3().subVectors(ball.position, spiderCenter);
                const currentDist = toBall.length();

                if (currentDist < minDistance) {
                    toBall.normalize();
                    ball.position.copy(spiderCenter).addScaledVector(toBall, minDistance);

                    const pushDir = toBall.clone();
                    pushDir.y += 0.3;
                    pushDir.normalize();

                    const hitForce = playBallRequested ? (12 + Math.random() * 16) : (isJumping ? 18 : 10);
                    ballVelocity.add(pushDir.multiplyScalar(hitForce));

                    playSpiderKickSound();

                    if (playBallRequested) {
                        playBallRequested = false;
                        targetingBall = false;
                    }
                    pickNewTarget();
                }
            }

            // ===== Camera Update Logic =====
            if (cameraMode === 'follow') {
                const targetCamTarget = spiderGroup.position.clone().add(new THREE.Vector3(0, 1, 0));
                controls.target.lerp(targetCamTarget, 0.1);
                controls.update();
            } else if (cameraMode === 'fpv') {
                spiderGroup.updateMatrixWorld(true);

                const eyeLocal = new THREE.Vector3(0, 1.3, 6.0);
                const eyeWorld = eyeLocal.clone().applyMatrix4(spiderGroup.matrixWorld);
                camera.position.copy(eyeWorld);

                const lookAtLocal = new THREE.Vector3(0, 1.3, 11.5);
                const lookAtWorld = lookAtLocal.clone().applyMatrix4(spiderGroup.matrixWorld);
                camera.lookAt(lookAtWorld);
                controls.target.copy(lookAtWorld);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
