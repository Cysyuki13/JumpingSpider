<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jumping Spider Pet</title>
    <link rel="icon" type="image/png" href="spider.png">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #sidebar {
            position: absolute;
            top: 20px;
            right: 0;
            width: 70px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 12px 0 0 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: -4px 8px 32px rgba(0, 0, 0, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.collapsed {
            transform: translateX(calc(50% + 15px));
        }

        #sidebar.collapsed:hover {
            transform: translateX(calc(50%));
            cursor: pointer;
        }

        #left-sidebar {
            position: absolute;
            top: 20px;
            left: 0;
            width: 80px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 0 12px 12px 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 4px 8px 32px rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #left-sidebar.collapsed {
            transform: translateX(calc(-50% - 15px));
        }

        #left-sidebar.collapsed:hover {
            transform: translateX(calc(-50%));
            cursor: pointer;
        }

        /* ====== BOTTOM INFO – Slide up/down like side menus ====== */
        #bottom-info-menu {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 12, 18, 0.82);
            backdrop-filter: blur(14px);
            border-radius: 16px 16px 0 0;
            padding: 8px 22px 8px 22px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 -6px 40px rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 480px;
            max-width: 92vw;
            user-select: none;
            pointer-events: auto;
            cursor: default;
        }

        #bottom-info-menu.collapsed {
            transform: translate(-50%, calc(100% - 28px));
        }

        #bottom-info-menu.collapsed:hover {
            transform: translate(-50%, calc(100% - 40px));
            cursor: pointer;
        }

        .info-toggle-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            height: auto;
            min-height: 44px;
            padding: 4px 0;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            width: 100%;
        }

        #btn-bottom-toggle {
            height: 28px;
            width: auto;
            padding: 0 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        #btn-bottom-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        #bottom-info-menu.collapsed #btn-bottom-toggle {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        #bottom-info-menu.collapsed .info-toggle-row {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .info-toggle-label {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.8px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .info-grid {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 18px;
            padding: 8px 0 4px 0;
            flex-shrink: 0;
        }

        .info-grid .info-item {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .info-grid .info-item .label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            font-size: 11px;
        }

        .info-grid .info-item .value {
            color: #fff;
            font-weight: 600;
        }

        .info-grid .info-item .value.name-value {
            color: #ffd93d;
            cursor: pointer;
            border-bottom: 1px dashed rgba(255, 217, 61, 0.3);
            padding: 0 2px;
            transition: border-color 0.2s;
        }

        .info-grid .info-item .value.name-value:hover {
            border-color: #ffd93d;
        }

        .info-grid .info-item .value.status-value {
            padding: 1px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            font-size: 11px;
        }

        .info-grid .info-item .value.size-value {
            color: #6bcfff;
        }

        .info-grid .info-item .value.age-value {
            color: #a8e6cf;
        }

        .info-grid .info-item .value.day-value {
            color: #ffb07c;
        }

        .info-grid .info-item .value.time-value {
            color: #b8b8ff;
        }

        .hunger-section {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 10px 2px 8px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .hunger-section .hunger-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        #spider-hunger-bar {
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #ff6b7a;
            font-weight: bold;
        }

        #hunger-timer-display {
            color: #ffaa44;
            font-family: monospace;
            font-size: 12px;
            min-width: 36px;
            text-align: center;
        }

        #spider-hunger-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            min-width: 32px;
            text-align: center;
        }

        .info-divider {
            color: rgba(255, 255, 255, 0.12);
            font-size: 10px;
        }

        /* ====== TOOL BUTTONS ====== */
        .tool-btn {
            width: 50px;
            height: 45px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .tool-btn.active {
            background: #ff3366;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
        }

        .tool-btn.lamp-on {
            background: #f9d342;
            color: #1a1a2e;
            box-shadow: 0 0 20px rgba(249, 211, 66, 0.5);
        }

        .tool-btn.lamp-auto {
            background: rgba(100, 200, 255, 0.3);
            border: 1px solid rgba(100, 200, 255, 0.3);
        }

        .tool-btn.lamp-off {
            background: rgba(255, 255, 255, 0.05);
        }

        #btn-toggle {
            height: 25px;
            font-size: 16px;
            align-self: center;
        }

        #btn-left-toggle {
            height: 25px;
            font-size: 16px;
            width: 50px;
            align-self: center;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .btn-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            user-select: none;
        }

        #btn-exit-cam {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(255, 51, 102, 0.85);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        #btn-exit-cam:hover {
            background: rgba(255, 51, 102, 1);
            transform: translateX(-50%) scale(1.05);
        }

        #feed-menu {
            position: absolute;
            top: 20px;
            right: 85px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .feed-option-btn {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .feed-option-btn:hover {
            background: #ff3366;
        }

        #time-control-panel {
            position: fixed;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 220px;
        }

        #time-control-panel label {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        #time-slider {
            width: 100%;
            cursor: pointer;
            accent-color: #ff3366;
        }

        /* Name edit overlay */
        .name-edit-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .name-edit-box {
            background: #1e1e2a;
            padding: 28px 32px 24px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 340px;
            width: 90%;
            text-align: center;
        }

        .name-edit-box h3 {
            color: #fff;
            margin: 0 0 12px 0;
            font-weight: 600;
            font-size: 18px;
        }

        .name-edit-box input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .name-edit-box input:focus {
            border-color: #ffd93d;
        }

        .name-edit-box .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
        }

        .name-edit-box .btn-row button {
            padding: 8px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .name-edit-box .btn-row button:hover {
            transform: scale(1.03);
        }

        .name-edit-box .btn-row .btn-save {
            background: #ffd93d;
            color: #1a1a2e;
        }

        .name-edit-box .btn-row .btn-save:hover {
            background: #ffe066;
        }

        .name-edit-box .btn-row .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
        }

        .name-edit-box .btn-row .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Responsive */
        @media (max-width: 640px) {
            #bottom-info-menu {
                min-width: unset;
                width: 96vw;
                padding: 6px 12px 6px 12px;
                font-size: 11px;
                border-radius: 12px 12px 0 0;
            }

            #bottom-info-menu.collapsed {
                transform: translate(-50%, calc(100% - 28px));
            }

            #bottom-info-menu.collapsed:hover {
                transform: translate(-50%, calc(100% - 36px));
            }

            .info-grid {
                gap: 4px 10px;
            }

            .info-grid .info-item {
                font-size: 11px;
            }

            .hunger-section {
                padding: 1px 6px 1px 4px;
            }

            #spider-hunger-bar {
                font-size: 12px;
            }

            #left-sidebar {
                width: 60px;
                padding: 8px;
            }

            #sidebar {
                width: 60px;
                padding: 8px;
            }

            .tool-btn {
                width: 40px;
                height: 38px;
                font-size: 18px;
            }

            .btn-label {
                font-size: 8px;
            }

            #btn-bottom-toggle {
                font-size: 12px;
                padding: 0 8px;
                height: 26px;
            }

            .info-toggle-row {
                min-height: 52px;
            }

            .info-toggle-label {
                font-size: 8px;
            }

            #bottom-info-menu.collapsed {
                transform: translate(-50%, calc(100% - 28px));
            }

            #bottom-info-menu.collapsed:hover {
                transform: translate(-50%, calc(100% - 36px));
            }

            .info-toggle-row {
                min-height: 28px;
                padding: 1px 0;
            }
        }

        @media (max-width: 480px) {
            #bottom-info-menu {
                padding: 4px 8px 4px 8px;
                font-size: 10px;
            }

            #bottom-info-menu.collapsed {
                transform: translate(-50%, calc(100% - 48px));
            }

            #bottom-info-menu.collapsed:hover {
                transform: translate(-50%, calc(100% - 56px));
            }

            .info-grid {
                gap: 2px 6px;
            }

            .info-grid .info-item {
                font-size: 10px;
            }

            .hunger-section .hunger-label {
                font-size: 9px;
            }

            #spider-hunger-bar {
                font-size: 11px;
            }

            #hunger-timer-display {
                font-size: 10px;
                min-width: 28px;
            }

            #spider-hunger-text {
                font-size: 9px;
                min-width: 26px;
            }

            .info-toggle-row {
                min-height: 48px;
            }

            #bottom-info-menu.collapsed {
                transform: translate(-50%, calc(100% - 38px));
            }

            #bottom-info-menu.collapsed:hover {
                transform: translate(-50%, calc(100% - 46px));
            }

            .info-toggle-row {
                min-height: 24px;
                padding: 1px 0;
            }
        }
    </style>
</head>

<body>
    <button id="btn-exit-cam">Exit Camera Mode</button>

    <div id="feed-menu">
        <button class="feed-option-btn" id="btn-feed-insect">🐛 Give Insect</button>
        <button class="feed-option-btn" id="btn-feed-fruit">🍉 Give Fruit</button>
    </div>

    <div id="time-control-panel">
        <label><span>Time of Day</span><span id="time-text">12:00 PM</span></label>
        <input type="range" id="time-slider" min="0" max="24" step="0.1" value="12">
    </div>

    <!-- Name Edit Overlay -->
    <div class="name-edit-overlay" id="name-edit-overlay">
        <div class="name-edit-box">
            <h3>🕷️ Name Your Spider</h3>
            <input type="text" id="name-edit-input" maxlength="20" placeholder="Enter name...">
            <div class="btn-row">
                <button class="btn-save" id="name-edit-save">Save</button>
                <button class="btn-cancel" id="name-edit-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- LEFT SIDEBAR -->
    <div id="left-sidebar">
        <button id="btn-left-toggle" class="tool-btn" title="Toggle Setting Menu">◀</button>
        <div class="menu-item">
            <button id="btn-dance" class="tool-btn" title="Force Dance">💃</button>
            <span class="btn-label">Dance</span>
        </div>
        <div class="menu-item">
            <button id="btn-play-ball" class="tool-btn" title="Play Ball Once">⚽</button>
            <span class="btn-label">Play Ball</span>
        </div>
        <div class="menu-item">
            <button id="btn-follow-cam" class="tool-btn" title="Follow Cam">🎥</button>
            <span class="btn-label">Follow</span>
        </div>
        <div class="menu-item">
            <button id="btn-fpv-cam" class="tool-btn" title="First Person Cam">🕷️</button>
            <span class="btn-label">Spider View</span>
        </div>
        <div class="menu-item">
            <button id="btn-time-system" class="tool-btn" title="Day/Night System">🌙</button>
            <span class="btn-label">Time</span>
        </div>
        <!-- LAMP TOGGLE -->
        <div class="menu-item">
            <button id="btn-lamp-toggle" class="tool-btn lamp-auto" title="Toggle Lamp Mode">💡</button>
            <span class="btn-label" id="lamp-label">Auto</span>
        </div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div id="sidebar">
        <button id="btn-toggle" class="tool-btn" title="Toggle Tool Menu">▶</button>
        <div class="menu-item">
            <button id="btn-fullscreen" class="tool-btn" title="Toggle Fullscreen">⛶</button>
            <span class="btn-label">Full</span>
        </div>
        <div class="menu-item">
            <button id="btn-finger" class="tool-btn" title="Finger Tool">👆</button>
            <span class="btn-label">Finger</span>
        </div>
        <div class="menu-item">
            <button id="btn-grab" class="tool-btn" title="Grab Tool">✊</button>
            <span class="btn-label">Grab</span>
        </div>
        <div class="menu-item">
            <button id="btn-brush" class="tool-btn" title="Brush Tool">🧹</button>
            <span class="btn-label">Brush</span>
        </div>
        <div class="menu-item">
            <button id="btn-feed" class="tool-btn" title="Feeding Menu">🍖</button>
            <span class="btn-label">Feed</span>
        </div>
    </div>

    <!-- ====== BOTTOM INFO PANEL – toggle row at TOP ====== -->
    <div id="bottom-info-menu">
        <!-- Toggle Row at the TOP – stacked vertically -->
        <div class="info-toggle-row">
            <button id="btn-bottom-toggle" title="Toggle Info Panel">▼</button>
            <span class="info-toggle-label">🕷️ INFO</span>
        </div>

        <!-- Info Grid -->
        <div class="info-grid">
            <div class="info-item">
                <span class="label">🕷️</span>
                <!-- Name -->
                <span class="value name-value" id="spider-name-display">Jumpy</span>
                <span style="font-size:10px;color:rgba(255,255,255,0.3);cursor:pointer;"
                    id="name-edit-trigger">✏️</span>
            </div>

            <span class="info-divider">•</span>

            <!-- Status -->
            <div class="info-item">
                <span class="label">Status</span>
                <span class="value status-value" id="spider-status-display">😐 Neutral</span>
            </div>

            <span class="info-divider">•</span>

            <!-- Age -->
            <div class="info-item">
                <span class="label">📅 Age</span>
                <span class="value age-value" id="spider-age-display">0 days</span>
            </div>

            <span class="info-divider">•</span>

            <!-- Size -->
            <div class="info-item">
                <span class="label">📏 Size</span>
                <span class="value size-value" id="spider-size-display">1.0 cm</span>
            </div>

            <span class="info-divider">•</span>

            <!-- Total Days -->
            <div class="info-item">
                <span class="label">📆 Total Days</span>
                <span class="value day-value" id="spider-total-days-display">0</span>
            </div>

            <span class="info-divider">•</span>

            <!-- Time -->
            <div class="info-item">
                <span class="label">🌙</span>
                <span class="value time-value" id="spider-time-display">12:00 PM</span>
            </div>

            <span class="info-divider">•</span>

            <!-- Hunger -->
            <div class="hunger-section">
                <span class="hunger-label">🍴</span>
                <span id="spider-hunger-bar">||||||||||</span>
                <span id="spider-hunger-text">10/10</span>
                <span id="hunger-timer-display" style="color:#ffaa44;font-family:monospace;font-size:11px;">00:15</span>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ================================================================
        //  PERSISTENCE LAYER
        // ================================================================
        const STORAGE_KEY = 'spider_pet_data';

        function getDefaultData() {
            return {
                name: 'Jumpy',
                birthTimestamp: Date.now(),
                totalDays: 0,
                lastDayTime: 12.0,
                totalHoursPassed: 0,
                hungryLevel: 10,
                hungerTimer: 15,
                lampMode: 'auto' // 'auto' | 'on' | 'off'
            };
        }

        function loadSpiderData() {
            try {

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);

            osc.type = 'sine';
            const baseFreq = 120 * Math.min(Math.max(intensity, 0.2), 2.0);
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2 * Math.min(intensity, 1.0), audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);

        function getTerrainHeight(x, z) {
            const edgeDistanceX = (boxSize / 2) - Math.abs(x);
            const edgeDistanceZ = (boxSize / 2) - Math.abs(z);
            const edgeFactor = Math.min(1.0, Math.max(0, Math.min(edgeDistanceX, edgeDistanceZ) / 2.0));
            return (Math.sin(x * 0.35) * Math.cos(z * 0.35) * 0.6 +
                Math.sin(x * 0.8) * Math.sin(z * 0.7) * 0.25 +
                Math.cos(x * 1.5 + z * 1.5) * 0.1) * edgeFactor;
        }

        function getTerrainNormal(x, z) {
            const eps = 0.1;
            const hL = getTerrainHeight(x - eps, z);
            const hR = getTerrainHeight(x + eps, z);
            const hD = getTerrainHeight(x, z - eps);
            const hU = getTerrainHeight(x, z + eps);
            const normal = new THREE.Vector3(hL - hR, 2.0 * eps, hD - hU);
            normal.normalize();
            return normal;
        }

            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 55000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const radius = Math.random() * 2.2;
                const shade = Math.random();
                if (shade < 0.5) ctx.fillStyle = 'rgba(30, 18, 8, 0.5)';
                else if (shade < 0.8) ctx.fillStyle = 'rgba(75, 50, 28, 0.45)';
                else if (shade < 0.95) ctx.fillStyle = 'rgba(115, 85, 55, 0.35)';
                else ctx.fillStyle = 'rgba(140, 120, 100, 0.4)';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(5, 5);
            return texture;

        function createWebTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const cx = 256,
                cy = 256,
                maxRadius = 240;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            const numRadials = 8,
                numSpirals = 5;
            ctx.beginPath();
            for (let i = 0; i < numRadials; i++) {
                const angle = (i / numRadials) * Math.PI * 2;
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(angle) * maxRadius, cy + Math.sin(angle) * maxRadius);
            }
            ctx.stroke();
            for (let j = 1; j <= numSpirals; j++) {
                const r = (j / numSpirals) * (maxRadius * 0.95);
                ctx.beginPath();
                for (let i = 0; i <= numRadials; i++) {
                    const angle = (i / numRadials) * Math.PI * 2;
                    const nextAngle = ((i + 1) / numRadials) * Math.PI * 2;
                    const x1 = cx + Math.cos(angle) * r;
                    const y1 = cy + Math.sin(angle) * r;
                    const x2 = cx + Math.cos(nextAngle) * r;
                    const y2 = cy + Math.sin(nextAngle) * r;
                    if (i === 0) ctx.moveTo(x1, y1);
                    if (i < numRadials) {
                        const sagFactor = 0.85;
                        const midAngle = (angle + nextAngle) / 2;
                        const midX = cx + Math.cos(midAngle) * (r * sagFactor);
                        const midY = cy + Math.sin(midAngle) * (r * sagFactor);
                        ctx.quadraticCurveTo(midX, midY, x2, y2);
                    }
                }
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- Lamp state ---

        // --- Lamp control functions ---
        function setLampState(on) {
            lampIsOn = on;
            // 灯泡自发光强度（原 1.2 → 可改为 2.5 或更高）
            lampBulbMat.emissiveIntensity = on ? 2.5 : 0;
            // 灯泡颜色亮度（保持暖色）
            lampBulbMat.color.setHex(on ? 0xFFFAE5 : 0x444444);
            // 光晕球透明度（原 0.25 → 可提高到 0.5）
            lampGlowMat.opacity = on ? 0.5 : 0;
            // 发光环自发光强度（原 0.6 → 可提高到 1.5）
            lampGlowRingMat.emissiveIntensity = on ? 1.5 : 0;
            lampGlowRingMat.opacity = on ? 0.9 : 0;

            // 主光源强度（原 2.2 → 可提高到 4.0~6.0）
            lampLightRef.intensity = on ? 4.5 : 0;
            // 辅助补光强度（原 1.0 → 可提高到 2.0）
            lampFillLightRef.intensity = on ? 2.0 : 0;

            // 可选：增大光源照射范围（原 distance 为 10 和 14）
            lampLightRef.distance = 50;      // 可在定义时直接改，或在此赋值
            lampFillLightRef.distance = 50;  // 可在定义时直接改，或在此赋值

            updateLampButtonUI();
        }

        function updateLampButtonUI() {
            // Remove all lamp classes
            btnLampToggle.classList.remove('lamp-on', 'lamp-auto', 'lamp-off');

            if (lampMode === 'auto') {
                btnLampToggle.classList.add('lamp-auto');
                lampLabel.textContent = 'Auto';
                btnLampToggle.title = 'Lamp: Auto (follows time)';
            } else if (lampMode === 'on') {
                btnLampToggle.classList.add('lamp-on');
                lampLabel.textContent = 'On';
                btnLampToggle.title = 'Lamp: Always On';
            } else {
                btnLampToggle.classList.add('lamp-off');
                lampLabel.textContent = 'Off';
                btnLampToggle.title = 'Lamp: Always Off';
            }
        }

        function updateLampFromTime(hour) {
            // Auto mode: on between 6 PM (18:00) and 6 AM (6:00)
            const isNight = (hour >= 18 || hour < 6);

            if (lampMode === 'auto') {
                setLampState(isNight);
            } else if (lampMode === 'on') {
                setLampState(true);
            } else {
                setLampState(false);
            }
        }

        // --- Lamp button handler ---
        btnLampToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            playClickSound();

            // Cycle: auto → on → off → auto ...
            if (lampMode === 'auto') {
                lampMode = 'on';
            } else if (lampMode === 'on') {
                lampMode = 'off';
            } else {
                lampMode = 'auto';
            }

            // Save to persistence
            spiderData.lampMode = lampMode;
            saveSpiderData(spiderData);

            // Apply based on current time
            const currentHour = parseFloat(timeSlider.value);
            updateLampFromTime(currentHour);
            updateLampButtonUI();
        });

        function updateEmotionStatusDisplay() {
            const statusEl = document.getElementById('spider-status-display');
            if (!statusEl) return;
            let emoji = '😐',
                label = 'Neutral';
            if (happyTimer > 0) spiderEmotion = 'happy';
            else if (spiderHungryLevel <= 3) spiderEmotion = 'annoyed';
            else if (spiderHungryLevel <= 5) spiderEmotion = 'sad';
            else if (isEating || isShootingWeb) spiderEmotion = 'happy';
            else spiderEmotion = 'neutral';
            emoji = getStatusEmoji(spiderEmotion);

            statusEl.textContent = `${emoji} ${label}`;

        }

        function spawnEmotionParticle() {
            if (spiderEmotion === 'neutral') return;
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);
            ctx.font = 'bold 52px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let symbol = '';
            if (spiderEmotion === 'happy') {
                symbol = '♥';
                ctx.fillStyle = '#ff3366';
            } else if (spiderEmotion === 'sad') {
                const sadSymbols = ['#', '?', '...', '-_-', '~'];
                symbol = sadSymbols[Math.floor(Math.random() * sadSymbols.length)];
                ctx.fillStyle = '#70a1ff';
            } else if (spiderEmotion === 'annoyed') {
                const symbolPool = ['#', '&', '!', '?', '#!?', '&?!', '!?#', '?!'];
                const count = Math.floor(Math.random() * 2) + 1;
                symbol = '';
                for (let i = 0; i < count; i++) { symbol += symbolPool[Math.floor(Math.random() * symbolPool.length)]; }
                ctx.fillStyle = '#ff4757';
            }
            ctx.fillText(symbol, 64, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
            const sprite = new THREE.Sprite(spriteMat);
            const offset = new THREE.Vector3((Math.random() - 0.5) * 0.8, 2.2 + Math.random() * 0.5, (Math.random() - 0.5) *
                0.8);
            sprite.position.copy(spiderGroup.position).add(offset);
            sprite.scale.set(0.8, 0.8, 0.8);
            scene.add(sprite);
            emotionParticles.push({
                sprite: sprite,
                life: 1.0,
                velocity: new THREE.Vector3((Math.random() - 0.5) * 0.5, 1.0 + Math.random() * 0.5, (Math.random() - 0.5) *
                    0.5)
            });
        }

        function addHighlightToObject(obj) {
            if (!obj) return;
            if (obj.isGroup) {
                obj.children.forEach(child => { if (child.isMesh || child.isGroup) addHighlightToObject(child); });
                return;
            }
            if (obj.isMesh) {
                if (obj.userData.highlight) return;
                try {
                    const edges = new THREE.EdgesGeometry(obj.geometry);
                    const material = new THREE.LineBasicMaterial({
                        color: 0x00ffff, transparent: true, opacity: 0.7,
                        depthTest: false
                    });
                    const wireframe = new THREE.LineSegments(edges, material);
                    wireframe.position.set(0, 0, 0);
                    wireframe.renderOrder = 999;
                    obj.add(wireframe);
                    obj.userData.highlight = wireframe;
                } catch (e) { /* ignore */ }
            }
        }

        function removeHighlightFromObject(obj) {
            if (!obj) return;
            if (obj.isGroup) {
                obj.children.forEach(child => { if (child.isMesh || child.isGroup) removeHighlightFromObject(child); });
                return;
            }
            if (obj.isMesh && obj.userData.highlight) {
                const h = obj.userData.highlight;
                obj.remove(h);
                if (h.geometry) h.geometry.dispose();
                if (h.material) h.material.dispose();
                obj.userData.highlight = null;
            }
        }

        function updateLightingSystem(hour) {
            const h = Math.floor(hour);
            const m = Math.floor((hour - h) * 60);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const displayHour = h % 12 === 0 ? 12 : h % 12;
            const displayMin = m < 10 ? '0' + m : m;
            timeText.textContent = `${displayHour}:${displayMin} ${ampm}`;
            updateTimeDisplay(hour);

            const angle = (hour / 24) * Math.PI * 2 - Math.PI / 2;
            const radius = 30;
            dirLight.position.x = Math.cos(angle) * radius;
            dirLight.position.y = Math.sin(angle) * radius;
            dirLight.position.z = 10;

            let skyColor, bgHex, ambientIntensity, dirIntensity;
            if (hour >= 5 && hour < 7) {
                const t = (hour - 5) / 2;
                skyColor = new THREE.Color().lerpColors(new THREE.Color(0x0b1329), new THREE.Color(0xff8c42), t);
                bgHex = new THREE.Color().lerpColors(new THREE.Color(0x080c14), new THREE.Color(0x382216), t);
                ambientIntensity = THREE.MathUtils.lerp(0.1, 0.4, t);
                dirIntensity = THREE.MathUtils.lerp(0.1, 0.5, t);
            } else if (hour >= 7 && hour < 17) {
                skyColor = new THREE.Color(0xffffff);
                bgHex = new THREE.Color(0x222222);
                ambientIntensity = 0.6;
                dirIntensity = 0.8;
            } else if (hour >= 17 && hour < 19) {
                const t = (hour - 17) / 2;
                skyColor = new THREE.Color().lerpColors(new THREE.Color(0xffffff), new THREE.Color(0xff4500), t);
                bgHex = new THREE.Color().lerpColors(new THREE.Color(0x222222), new THREE.Color(0x200c14), t);
                ambientIntensity = THREE.MathUtils.lerp(0.6, 0.2, t);
                dirIntensity = THREE.MathUtils.lerp(0.8, 0.3, t);
            } else {
                skyColor = new THREE.Color(0x446699);
                bgHex = new THREE.Color(0x080c14);
                ambientIntensity = 0.15;
                dirIntensity = 0.1;
            }

            scene.background = bgHex;
            ambientLight.color = skyColor;
            ambientLight.intensity = ambientIntensity;
            dirLight.color = skyColor;
            dirLight.intensity = Math.max(0, dirLight.position.y > 0 ? dirIntensity : 0.05);

            // Update lamp based on time
            updateLampFromTime(hour);
        }

        const raycaster = new THREE.Raycaster();

        function cleanWithBrush(event) {
            if (activeTool !== 'brush') return;
            if (event.button !== 0 && event.pointerType === 'mouse') return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            let cleaned = false;
            if (landedWebs.length > 0) {
                const webIntersects = raycaster.intersectObjects(landedWebs);
                for (let i = 0; i < webIntersects.length; i++) {
                    const web = webIntersects[i].object;
                    removeHighlightFromObject(web);
                    scene.remove(web);
                    const idx = landedWebs.indexOf(web);
                    if (idx !== -1) landedWebs.splice(idx, 1);
                    cleaned = true;
                }
            }
            const foodMeshes = [];
            foodGroup.children.forEach(child => {
                child.traverse(node => { if (node.isMesh) foodMeshes.push(node); });
            });
            if (foodMeshes.length > 0) {
                const foodIntersects = raycaster.intersectObjects(foodMeshes);
                for (let i = 0; i < foodIntersects.length; i++) {
                    let rootFood = foodIntersects[i].object;
                    while (rootFood.parent && rootFood.parent !== foodGroup) {
                        rootFood = rootFood.parent;
                    }
                    if (foodGroup.children.includes(rootFood)) {
                        if (foodBeingEaten === rootFood) {
                            foodBeingEaten = null;
                            isEating = false;
                            eatingTimer = 0;
                        }
                        if (webTargetFood === rootFood) {
                            webTargetFood = null;
                            isShootingWeb = false;
                            webState = 'idle';
                            if (webLineMesh) {
                                scene.remove(webLineMesh);
                                webLineMesh.geometry.dispose();
                                webLineMesh = null;
                            }
                            if (webProjectileMesh) webProjectileMesh.visible = false;
                        }
                        if (targetFoodPiece === rootFood) targetFoodPiece = null;
                        if (activeInsect === rootFood) activeInsect = null;
                        removeHighlightFromObject(rootFood);
                        foodGroup.remove(rootFood);
                        cleaned = true;
                        playClickSound();
                    }
                }
            }
            if (cleaned) playClickSound();
        }

        window.addEventListener('pointerdown', (event) => {
            if (activeTool === 'brush') { cleanWithBrush(event); return; }
            if (event.button !== 0 && event.pointerType === 'mouse') return;
            if (event.clientX < 90 && event.clientY < 340) return;
            if (event.clientX > window.innerWidth - 90 && event.clientY < 260) return;
            if (timeControlPanel.contains(event.target) || feedMenu.contains(event.target)) return;

            if (holdingFoodType) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                cursorPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0));
                if (raycaster.ray.intersectPlane(cursorPlane, cursorWorldPos)) {
                    playClickSound();
                    const limit = (boxSize / 2) - 1.5;
                    const dropX = Math.max(-limit, Math.min(limit, cursorWorldPos.x));
                    const dropZ = Math.max(-limit, Math.min(limit, cursorWorldPos.z));
                    const dropPos = new THREE.Vector3(dropX, 0, dropZ);

            if (!activeTool) return;
            activePointerId = event.pointerId;
            event.target.setPointerCapture?.(activePointerId);
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const spiderMeshes = [];
            spiderGroup.traverse(child => { if (child.isMesh) spiderMeshes.push(child); });
            const spiderIntersect = raycaster.intersectObjects(spiderMeshes);
            const ballIntersect = raycaster.intersectObject(ball);

            let foodIntersect = [];
            const foodMeshes = [];
            foodGroup.traverse(child => { if (child.isMesh) foodMeshes.push(child); });
            foodIntersect = raycaster.intersectObjects(foodMeshes);

            if (activeTool === 'finger') {

                    isJumping = true;
                    trackingCursor = false;
                    targetingBall = false;
                    playBallRequested = false;
                    isFrontLegDancing = false;
                    isShootingWeb = false;
                    webState = 'idle';
                } else if (ballIntersect.length > 0) {
                    playClickSound();
                    isHoldingBall = true;
                    chargeTime = 0;
                    ballOriginalPos.copy(ball.position);
                    ballVelocity.set(0, 0, 0);
                    if (cameraMode !== 'fpv') controls.enabled = false;
                    trackingCursor = false;
                } else if (foodIntersect.length > 0 && !isEating && !isShootingWeb) {
                    playClickSound();
                    let rootFood = foodIntersect[0].object;
                    while (rootFood.parent && rootFood.parent !== foodGroup) {
                        rootFood = rootFood.parent;
                    }
                    if (webShootCooldown <= 0) {
                        webTargetFood = rootFood;
                        webTargetFood.userData.webAttemptCount = (webTargetFood.userData.webAttemptCount || 0) + 1;
                        isShootingWeb = true;
                        webState = 'shooting';
                        webShootCooldown = spiderEmotion === 'annoyed' ? 1.0 : 6.0;
                        isJumping = false;
                        isFrontLegDancing = false;
                        trackingCursor = false;
                        isRandomWebShot = false;
                        const spiderMouthPos = spiderGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));
                        webProjectilePos.copy(spiderMouthPos);
                        const toTarget = new THREE.Vector3().subVectors(webTargetFood.position, spiderMouthPos);
                        const distance = toTarget.length();
                        toTarget.normalize();
                        webProjectileVel.copy(toTarget).multiplyScalar(Math.min(10 + distance * 0.2, 16));
                        webProjectileVel.y = 2 + distance * 0.1;
                        if (!webProjectileMesh) {
                            webProjectileMesh = new THREE.Mesh(webProjGeo, webProjMat);
                            scene.add(webProjectileMesh);
                        }
                        const randomWebScale = 0.5 + Math.random() * 1.5;
                        webProjectileMesh.scale.set(randomWebScale, randomWebScale, randomWebScale);
                        webProjectileMesh.userData.currentScale = randomWebScale;
                        webProjectileMesh.position.copy(webProjectilePos);
                        webProjectileMesh.visible = true;
                    } else {
                        targetFoodPiece = rootFood;
                        targetPosition.set(rootFood.position.x, 0, rootFood.position.z);
                        spiderSpeed = 0.08;
                        isJumping = false;
                        isFrontLegDancing = false;
                        trackingCursor = false;
                    }
                } else {
                    playClickSound();
                    trackingCursor = true;
                    targetingBall = false;
                    playBallRequested = false;
                    isJumping = false;
                    isFrontLegDancing = false;
                }
            } else if (activeTool === 'grab') {
                if (spiderIntersect.length > 0) {
                    grabbedObject = 'spider';
                    isJumping = false;
                    isFrontLegDancing = false;
                    isShootingWeb = false;
